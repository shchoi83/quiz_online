<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>저장 테스트 · 궁극의 물리</title>
<style>
  :root{
    --bg:#EEF1F4;
    --surface:#FFFFFF;
    --ink:#131A26;
    --muted:#5C6B7F;
    --line:#D3DAE3;
    --accent:#1B5E9B;
    --ok:#0F7B54;
    --err:#B3261E;
    --warn:#8A5A00;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px 16px 64px;
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:640px;margin:0 auto}

  header{margin-bottom:20px}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin:0 0 4px;
  }
  h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:20px;margin-bottom:16px;
  }
  .card h2{
    font-size:13px;font-weight:700;letter-spacing:.04em;
    margin:0 0 14px;color:var(--muted);text-transform:uppercase;
  }

  label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
  label:first-of-type{margin-top:0}
  input[type=text],select{
    width:100%;padding:10px 12px;font-size:15px;
    border:1px solid var(--line);border-radius:6px;
    background:#FBFCFD;color:var(--ink);font-family:inherit;
  }
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .hint{font-size:12px;color:var(--muted);margin:5px 0 0}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  button{
    font-family:inherit;font-size:15px;font-weight:600;
    padding:12px 16px;border-radius:6px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink);
    width:100%;margin-top:16px;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:hover{filter:brightness(.96)}
  button:disabled{opacity:.45;cursor:not-allowed}

  .opt{
    display:block;width:100%;text-align:left;margin:8px 0 0;
    padding:12px 14px;font-size:15px;font-weight:400;
  }
  .opt.picked{border-color:var(--accent);background:#EAF2F9}
  .qnum{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
  .qtext{font-weight:600;margin:4px 0 0}
  .q+.q{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}

  .toggle{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:14px}
  .toggle input{width:auto;margin:0}

  /* 로그 패널 — 이 페이지의 핵심 */
  #logCard{background:#101720;border-color:#101720}
  #logCard h2{color:#7E93AB}
  #log{
    font-family:var(--mono);font-size:12.5px;line-height:1.65;
    color:#C6D2E0;white-space:pre-wrap;word-break:break-all;
    max-height:340px;overflow-y:auto;margin:0;
  }
  .l-ok{color:#4ADE9B}
  .l-err{color:#FF8A80}
  .l-warn{color:#FFC46B}
  .l-dim{color:#6B7F96}
  .l-key{color:#7FC4FF}

  .verdict{
    margin-top:14px;padding:12px 14px;border-radius:6px;
    font-weight:600;font-size:14px;display:none;
  }
  .verdict.show{display:block}
  .v-ok{background:#E4F5EC;color:var(--ok);border:1px solid #A8DCC3}
  .v-err{background:#FCEAE8;color:var(--err);border:1px solid #F0B6B0}

  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">Migration Test · Airtable → Google Sheets</p>
  <h1>점수 저장 테스트</h1>
  <p class="sub">실제 퀴즈와 같은 경로로 3문항을 풀고 저장합니다. 결과는 아래 로그에 그대로 기록됩니다.</p>
</header>

<!-- 1. 설정 -->
<div class="card" id="setupCard">
  <h2>1 · 연결 설정</h2>

  <label for="gsUrl">Apps Script 웹앱 URL</label>
  <input type="text" id="gsUrl" placeholder="https://script.google.com/macros/s/.../exec" spellcheck="false">
  <p class="hint">배포 후 받은 <code>/exec</code>로 끝나는 주소를 붙여넣으세요.</p>

  <label for="subject">과목 (탭 라우팅 확인용)</label>
  <select id="subject">
    <option value="PHY">PHY · 물리학</option>
    <option value="MEC">MEC · 역학과 에너지</option>
    <option value="EMQ">EMQ · 전자기와 양자</option>
    <option value="XXX">XXX · 잘못된 코드 (ETC 탭으로 가는지 확인)</option>
  </select>

  <label for="name">이름</label>
  <input type="text" id="name" value="테스트">

  <div class="row">
    <div>
      <label for="school">학교</label>
      <input type="text" id="school" value="테스트고">
    </div>
    <div>
      <label for="phone">전화 뒷 4자리</label>
      <input type="text" id="phone" value="0000" maxlength="4">
    </div>
  </div>

  <div class="toggle">
    <input type="checkbox" id="dual">
    <label for="dual" style="margin:0;font-weight:400">Airtable에도 함께 저장 (레코드·API 한도를 소모합니다)</label>
  </div>

  <button class="primary" id="startBtn">연결 확인하고 시작</button>
</div>

<!-- 2. 퀴즈 -->
<div class="card hide" id="quizCard">
  <h2>2 · 문항</h2>
  <div id="questions"></div>
  <button class="primary" id="submitBtn">채점하고 저장</button>
</div>

<!-- 3. 로그 -->
<div class="card" id="logCard">
  <h2>실행 로그</h2>
  <pre id="log"></pre>
  <div class="verdict" id="verdict"></div>
</div>

<button id="resetBtn" class="hide">다시 테스트</button>

</div>

<script>
// ══════════════════════════════════════
// 테스트 데이터
// ══════════════════════════════════════
const QUIZ = [
  {num:1, text:"전기력에 대한 설명으로 옳은 것은?",
   opts:["같은 종류의 전하끼리는 인력이 작용한다.",
         "같은 종류의 전하끼리는 척력이 작용한다.",
         "전하의 종류와 전기력은 무관하다.",
         "전기력은 거리에 비례한다."], ans:2},
  {num:2, text:"쿨롱 법칙에서 전기력의 크기는 두 전하 사이 거리 r에 대해 어떻게 되는가?",
   opts:["r에 비례", "r에 반비례", "r²에 비례", "r²에 반비례"], ans:4},
  {num:3, text:"전기장의 방향은 어떻게 정의되는가?",
   opts:["음전하가 받는 힘의 방향", "양전하가 받는 힘의 방향",
         "전위가 높아지는 방향", "전하의 이동 속도 방향"], ans:2}
];

const SUBJECT_NAMES = {PHY:"물리학", MEC:"역학과 에너지", EMQ:"전자기와 양자", XXX:"테스트"};

let answers = {};
let startedAt = 0;

// ══════════════════════════════════════
// 로그
// ══════════════════════════════════════
const logEl = document.getElementById('log');
function log(msg, cls){
  const t = new Date().toTimeString().slice(0,8);
  const span = document.createElement('span');
  span.className = cls || '';
  span.textContent = `[${t}] ${msg}\n`;
  logEl.appendChild(span);
  logEl.scrollTop = logEl.scrollHeight;
}
function logBlock(label, obj){
  log(label, 'l-key');
  log(JSON.stringify(obj, null, 2), 'l-dim');
}

// ══════════════════════════════════════
// 시작
// ══════════════════════════════════════
document.getElementById('startBtn').addEventListener('click', function(){
  const url = document.getElementById('gsUrl').value.trim();
  if (!url) { log('웹앱 URL을 입력하세요.', 'l-err'); return; }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)) {
    log('URL 형식이 다릅니다. /exec 로 끝나야 합니다. 그래도 시도합니다.', 'l-warn');
  }
  log('웹앱 응답 확인 중 (GET)...', 'l-dim');
  fetch(url)
    .then(function(r){ return r.text(); })
    .then(function(txt){
      log('GET 응답: ' + txt.slice(0,200), 'l-ok');
      log('웹앱이 살아 있습니다. 문항으로 이동합니다.', 'l-ok');
      showQuiz();
    })
    .catch(function(err){
      log('GET 실패: ' + err.message, 'l-err');
      log('배포 설정에서 "액세스 권한: 모든 사용자"인지 확인하세요.', 'l-warn');
      log('그래도 POST는 시도해볼 수 있습니다. 문항으로 이동합니다.', 'l-warn');
      showQuiz();
    });
});

function showQuiz(){
  document.getElementById('setupCard').classList.add('hide');
  document.getElementById('quizCard').classList.remove('hide');
  startedAt = Date.now();
  renderQuestions();
}

function renderQuestions(){
  const box = document.getElementById('questions');
  box.innerHTML = '';
  QUIZ.forEach(function(q){
    const d = document.createElement('div');
    d.className = 'q';
    d.innerHTML = '<p class="qnum">문항 ' + q.num + '</p><p class="qtext">' + q.text + '</p>';
    q.opts.forEach(function(o, i){
      const b = document.createElement('button');
      b.className = 'opt';
      b.textContent = (i+1) + '. ' + o;
      b.addEventListener('click', function(){
        answers[q.num] = i+1;
        Array.prototype.forEach.call(d.querySelectorAll('.opt'), function(x){ x.classList.remove('picked'); });
        b.classList.add('picked');
      });
      d.appendChild(b);
    });
    box.appendChild(d);
  });
}

// ══════════════════════════════════════
// 저장 — 실제 퀴즈에 들어갈 코드와 동일
// ══════════════════════════════════════
function fmtTime(sec){
  const m = String(Math.floor(sec/60)).padStart(2,'0');
  const s = String(sec%60).padStart(2,'0');
  return m + ':' + s;
}

function buildPayload(score, total){
  const code = document.getElementById('subject').value;
  return {
    '이름': document.getElementById('name').value.trim(),
    '학교': document.getElementById('school').value.trim(),
    'phone_last4': document.getElementById('phone').value.trim(),
    '날짜': new Date().toISOString().split('T')[0],
    '과목코드': code,
    '과목명': SUBJECT_NAMES[code] || '',
    '대단원번호': 2,
    '대단원명': '전기와 자기',
    '중단원번호': 1,
    '중단원명': '전기',
    '섹션번호': 1,
    '섹션명': '[저장테스트] 전기장과 전위차',
    '총점': score,
    '총문항수': total,
    '풀이시간': fmtTime(Math.floor((Date.now()-startedAt)/1000))
  };
}

async function saveToSheets(payload){
  const url = document.getElementById('gsUrl').value.trim();
  // Content-Type을 text/plain으로 보내야 preflight(OPTIONS)가 발생하지 않음.
  // Apps Script 웹앱은 OPTIONS를 처리하지 못하므로 이 설정이 필수.
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const raw = await res.text();
  log('Sheets HTTP ' + res.status, 'l-dim');
  log('Sheets 응답 본문: ' + raw.slice(0,300), 'l-dim');
  let data;
  try { data = JSON.parse(raw); }
  catch(e){ throw new Error('응답이 JSON이 아닙니다. 로그인 페이지가 반환됐을 수 있습니다 (액세스 권한 확인).'); }
  if (data.ok !== true) throw new Error(data.error || 'sheets rejected');
  return data;
}

document.getElementById('submitBtn').addEventListener('click', async function(){
  const btn = this;
  const answered = Object.keys(answers).length;
  if (answered < QUIZ.length){
    log('아직 답하지 않은 문항이 있습니다 (' + answered + '/' + QUIZ.length + '). 그대로 저장합니다.', 'l-warn');
  }
  let score = 0;
  QUIZ.forEach(function(q){ if (answers[q.num] === q.ans) score++; });
  log('채점 결과: ' + score + ' / ' + QUIZ.length, '');

  const payload = buildPayload(score, QUIZ.length);
  logBlock('전송할 데이터:', payload);

  btn.disabled = true;
  log('Sheets로 POST 전송 중...', 'l-dim');

  const verdict = document.getElementById('verdict');
  try {
    const data = await saveToSheets(payload);
    log('저장 성공 — 탭: ' + data.tab + ', 행 번호: ' + data.row, 'l-ok');
    verdict.className = 'verdict show v-ok';
    verdict.textContent = '✓ 저장 성공 — "' + data.tab + '" 탭 ' + data.row + '행에 기록되었습니다.';
  } catch(err){
    log('저장 실패: ' + err.message, 'l-err');
    if (/Failed to fetch|NetworkError|CORS/i.test(err.message)){
      log('CORS 차단으로 보입니다. 배포 시 "액세스 권한: 모든 사용자"를 확인하고, 코드 수정 후에는 반드시 새 버전으로 재배포해야 합니다.', 'l-warn');
    }
    verdict.className = 'verdict show v-err';
    verdict.textContent = '✕ 저장 실패 — 위 로그의 마지막 줄을 확인하세요.';
  }

  if (document.getElementById('dual').checked){
    log('Airtable 병행 저장은 이 테스트 페이지에서 비활성화되어 있습니다.', 'l-warn');
    log('토큰을 공개 파일에 다시 넣지 않기 위한 조치입니다. 실제 퀴즈 파일에서 검증하세요.', 'l-dim');
  }

  document.getElementById('resetBtn').classList.remove('hide');
});

document.getElementById('resetBtn').addEventListener('click', function(){
  answers = {};
  document.getElementById('quizCard').classList.add('hide');
  document.getElementById('setupCard').classList.remove('hide');
  document.getElementById('verdict').className = 'verdict';
  this.classList.add('hide');
  log('─────────── 초기화 ───────────', 'l-dim');
});

log('테스트 페이지 준비 완료. 웹앱 URL을 입력하세요.', 'l-dim');
</script>
</body>
</html>
