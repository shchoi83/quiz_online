<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>물리 퀴즈 · 섹션 선택</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 60px 20px;
}

.container {
  max-width: 720px;
  margin: 0 auto;
}

.header {
  text-align: center;
  margin-bottom: 48px;
}

.tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

h1 {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}

.header p {
  color: var(--text-dim);
  font-size: 0.92rem;
}

.unit-section {
  margin-bottom: 32px;
}

.unit-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  margin-bottom: 12px;
  padding-left: 4px;
}

.quiz-card {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 24px;
  margin-bottom: 12px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.2s;
  box-shadow: var(--shadow);
}

.quiz-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.quiz-card.disabled {
  opacity: 0.5;
  pointer-events: none;
  cursor: not-allowed;
}

.quiz-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  background: var(--accent-light);
  color: var(--accent);
  padding: 6px 10px;
  border-radius: 8px;
  font-weight: 500;
  flex-shrink: 0;
  letter-spacing: 0.04em;
}

.quiz-info {
  flex: 1;
  min-width: 0;
}

.quiz-title {
  font-size: 1.05rem;
  font-weight: 500;
  margin-bottom: 4px;
}

.quiz-meta {
  font-size: 0.8rem;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.02em;
}

.quiz-arrow {
  color: var(--text-dim);
  font-size: 1.2rem;
  flex-shrink: 0;
  transition: transform 0.2s;
}

.quiz-card:hover .quiz-arrow {
  color: var(--accent);
  transform: translateX(4px);
}

.footer-note {
  text-align: center;
  margin-top: 48px;
  font-size: 0.78rem;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="tag">PHYSICS QUIZ</div>
    <h1>퀴즈 섹션 선택</h1>
    <p>개정물리학 · 응시할 섹션을 선택하세요</p>
  </div>

  <!-- 대단원 3 / 소단원 2 -->
  <div class="unit-section">
    <div class="unit-label">대단원 3 · 소단원 2</div>

    <a class="quiz-card" href="quiz-3_2_1_에너지_준위.html">
      <div class="quiz-num">3-2-1</div>
      <div class="quiz-info">
        <div class="quiz-title">에너지 준위</div>
        <div class="quiz-meta">20문항 · Basic</div>
      </div>
      <div class="quiz-arrow">→</div>
    </a>

    <a class="quiz-card" href="quiz-3_2_2_에너지띠와_반도체.html">
      <div class="quiz-num">3-2-2</div>
      <div class="quiz-info">
        <div class="quiz-title">에너지띠와 반도체</div>
        <div class="quiz-meta">21문항 · Basic</div>
      </div>
      <div class="quiz-arrow">→</div>
    </a>

    <a class="quiz-card" href="quiz-3_2_3_특수상대성.html">
      <div class="quiz-num">3-2-3</div>
      <div class="quiz-info">
        <div class="quiz-title">특수상대성</div>
        <div class="quiz-meta">20문항 · Basic + Advanced</div>
      </div>
      <div class="quiz-arrow">→</div>
    </a>
  </div>

  <div class="footer-note">궁극의 물리 · 최성훈T</div>
</div>

</body>
</html>
