<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛과 물질의 이중성 · 1차 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 공통 ── */
.screen { display: none; }
.screen.active { display: block; }

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 14px 28px;
  font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-ghost:hover { background: var(--accent-light); opacity: 1; }

/* ── SCREEN 1: 입력 ── */
#screen-intro {
  padding-top: 80px;
}

.intro-header {
  text-align: center;
  margin-bottom: 48px;
}

.intro-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

.intro-header h1 { margin-bottom: 8px; }
.intro-header p { color: var(--text-dim); font-size: 0.9rem; }

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

.form-group input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 1rem;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(--accent); }

.form-info {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: var(--accent-light);
  border-radius: 10px;
  padding: 14px 16px;
}

.form-info span {
  font-size: 0.82rem;
  color: var(--accent);
}

/* ── SCREEN 2: 퀴즈 ── */
#screen-quiz { padding-top: 0; }

.quiz-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.quiz-topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 6px;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.quiz-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-shrink: 0;
}

.meta-item {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.meta-item span {
  color: var(--text);
  font-weight: 500;
}

.quiz-body {
  padding: 32px 20px;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.3s;
}

.q-card.correct { border-color: var(--correct); }
.q-card.wrong { border-color: var(--wrong); }

.q-head {
  padding: 20px 24px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 3px;
  flex-shrink: 0;
}

.q-text {
  font-size: 0.93rem;
  line-height: 1.75;
  white-space: pre-line;
}

.q-options {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
  transition: all 0.15s;
  width: 100%;
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
}

.opt-btn:disabled { cursor: default; }

.opt-btn.correct {
  border-color: var(--correct);
  background: var(--correct-light);
  color: var(--correct);
}

.opt-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
  color: var(--wrong);
}

.opt-btn.reveal {
  border-color: rgba(45,90,61,0.35);
  background: rgba(45,90,61,0.04);
  color: rgba(45,90,61,0.6);
}

.opt-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}

.opt-btn.correct .opt-label { background: var(--correct); border-color: var(--correct); color: #fff; }
.opt-btn.wrong .opt-label { background: var(--wrong); border-color: var(--wrong); color: #fff; }

/* submit btn area */
.submit-wrap {
  padding: 0 20px 40px;
  max-width: 720px;
  margin: 0 auto;
}

/* ── SCREEN 3: 결과 ── */
#screen-result { padding-top: 48px; }

.result-hero {
  text-align: center;
  padding: 48px 20px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}

.result-name {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}

.result-score {
  font-size: 4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 4px;
}

.result-score-sub {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
}

.stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--text);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.result-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

.result-section h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-wrong {
  background: var(--wrong-light);
  color: var(--wrong);
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 20px;
  font-family: 'DM Mono', monospace;
}

/* review card */
.review-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.review-card .q-head { padding-bottom: 12px; }

.review-exp {
  padding: 14px 24px 18px;
  border-top: 1px solid var(--border);
  background: var(--accent-light);
}

.review-exp-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--accent);
  margin-bottom: 5px;
  letter-spacing: 0.06em;
}

.review-exp p {
  font-size: 0.84rem;
  color: var(--accent);
  line-height: 1.65;
}

.review-retry-wrap {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-actions {
  max-width: 720px;
  margin: 32px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* saving overlay */
.saving-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-family: 'DM Mono', monospace;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}

.saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: 이름 / 학교 입력
══════════════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <div class="container">
    <div class="intro-header">
      <div class="tag">PHYSICS QUIZ</div>
      <h1>빛과 물질의 이중성 · 1차</h1>
      <p>물리학 · 3단원 빛과 물질 · 1중단원 빛의 이해 · 3섹션 · 1차</p>
    </div>

    <div class="form-card">
      <div class="form-info">
        <span>📋 총 39문항 · 객관식 4지선다 · 시간 제한 없음</span>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" id="input-name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="input-school" placeholder="○○고등학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>전화번호 뒷자리 4자리 <span style="color:var(--text-dim);font-weight:300;">(동명이인 구별용)</span></label>
        <input type="tel" id="input-phone" placeholder="1234" autocomplete="off" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
      </div>

      <button class="btn" onclick="startQuiz()">시작하기 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: 퀴즈
══════════════════════════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-topbar">
    <div class="quiz-topbar-inner">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="quiz-meta">
        <div class="meta-item" id="metaProgress">0 / 39</div>
        <div class="meta-item">⏱ <span id="timerDisplay">00:00</span></div>
      </div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody"></div>

  <div class="submit-wrap">
    <button class="btn" onclick="submitQuiz()">제출하기</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 3: 결과
══════════════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="result-hero">
    <div class="result-name" id="resultName"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score-sub" id="resultScoreSub"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-val" id="statTime"></div>
        <div class="stat-label">풀이 시간</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statCorrect"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statWrong"></div>
        <div class="stat-label">오답</div>
      </div>
    </div>
  </div>

  <div class="result-section" id="reviewSection"></div>

  <div class="result-actions">
    <button class="btn btn-ghost" onclick="resetQuiz()">↺ 새로 응시하기</button>
  </div>
</div>

<div class="saving-toast" id="savingToast"></div>

<script>
// ══════════════════════════════════════
// Airtable 설정

const AT_TOKEN   = "patBcLElKAr7fPbgS.0f288a25e39501f27d9d33569371fc819acb54173cf44daa68fc028f16e479f9";

// ── Google Sheets 웹앱 (주 저장소) ──
const GS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzay6SAgvghcFDisFxk32UjxOpSg7aa7k85PrlqIYYE6fuCrAZAsbb_yyQI6N06y0zzrA/exec";
const DUAL_WRITE  = true;   // 전환 완료 후 false 로 바꾸면 Airtable 전송 중단

// ══════════════════════════════════════
// 퀴즈 메타
// ══════════════════════════════════════
const QUIZ_META = {
  subjectCode: "PHY",
  subjectName: "물리학",
  mainNo:      3,
  mainName:    "빛과 물질",
  subNo:       1,
  subName:     "빛의 이해",
  sectionNo:   3,
  sectionName: "빛과 물질의 이중성 · 1차"
};

// ══════════════════════════════════════
// 퀴즈 데이터
// ══════════════════════════════════════
// ══════════════════════════════════════
// 3-1-3 빛과 물질의 이중성 · 1차 (test01)
// 블록 정답 시퀀스:
// A(3): 4,3,1   B(3): 4,1,4   C(5): 1,2,3,2,1   D(5): 4,2,2,2,4
// E(3): 4,2,3   F(3): 3,1,3   G(2): 4,1   H(2): 1,3
// I(3): 3,2,2   J(3): 3,1,1   K(5): 4,1,2,2,3   L(3): 4,4,3
// ══════════════════════════════════════
const QUIZ = [
  // ══════════════════════════════════════
  // 블록 A. 빛의 에너지 vs 빛의 세기 (Q1~Q3)
  // ══════════════════════════════════════
  {num:1, text:"빛의 '에너지'와 '세기'에 대한 설명으로 옳은 것은?", opts:["빛의 에너지가 클수록 항상 빛의 세기도 크다.", "빛의 세기가 셀수록 한 광자의 에너지가 크다.", "빛의 색(파장)에 따라 세기가 결정된다.", "빛의 에너지는 진동수에 의해 결정되고, 빛의 세기는 단위 시간 동안 들어가는 에너지의 총량으로 결정된다."], ans:4, exp:"빛의 에너지(E = hf)는 진동수에 의해 결정됩니다. 한편 빛의 세기는 단위 시간당 들어가는 에너지의 총량 — 즉 광자의 개수가 많으면 \"센 빛\"입니다. 두 개념은 다릅니다."},

  {num:2, text:"빛의 종류에 따른 에너지 비교로 옳은 것은?", opts:["가시광선이 자외선보다 에너지가 크다.", "적외선이 가시광선보다 에너지가 크다.", "자외선이 적외선보다 에너지가 크다.", "감마선은 에너지가 매우 작아 인체에 무해하다."], ans:3, exp:"전자기파의 에너지는 진동수가 클수록 큽니다. 진동수 순: 적외선 < 가시광선 < 자외선 < 감마선. 따라서 자외선은 적외선보다 에너지가 크고, 자외선의 화학작용·살균 소독이 가능합니다. 감마선은 에너지가 매우 커 인체에 위험합니다."},

  {num:3, text:"같은 종류의 자외선 램프를 1개 켠 경우와 2개 켠 경우에 대한 설명으로 옳은 것은?", opts:["램프 2개를 켜면 단위 시간 동안 더 많은 에너지가 들어가므로 빛이 더 세다고 한다.", "램프 2개를 켜면 한 광자의 에너지가 두 배가 된다.", "램프 2개를 켜면 빛의 진동수가 두 배가 된다.", "램프 개수와 빛의 세기는 관계가 없다."], ans:1, exp:"램프를 더 많이 켜면 단위 시간 동안 들어가는 에너지의 총량이 늘어나므로 빛의 \"세기\"가 커집니다. 그러나 광자 한 개의 에너지(E = hf)나 빛의 진동수는 광원의 종류로 정해진 값이라 변하지 않습니다."},

  // ══════════════════════════════════════
  // 블록 B. 광전 효과 정의 + 광전자 (Q4~Q6)
  // ══════════════════════════════════════
  {num:4, text:"광전 효과의 정의로 옳은 것은?", opts:["금속 표면이 빛을 모두 반사하는 현상", "금속이 가열되어 빛을 내는 현상", "금속 내부에서 전자가 움직이며 빛을 흡수하는 현상", "금속 표면에 빛을 비추었을 때 전자가 튀어나오는 현상"], ans:4, exp:"광전 효과: 금속 표면에 일정 진동수 이상의 빛을 비추면 금속 표면에서 전자가 방출되는 현상입니다. (1887년 헤르츠가 발견, 1905년 아인슈타인이 광양자설로 설명)"},

  {num:5, text:"광전 효과에서 '광전자'의 정의로 옳은 것은?", opts:["광전 효과에 의해 금속 표면에서 튀어나온 전자", "광자(빛 알갱이) 그 자체", "빛에 의해 발생한 양전하 입자", "빛이 가속시킨 양성자"], ans:1, exp:"광전자는 광전 효과로 금속에서 튀어나온 전자를 말합니다. 광자(빛 알갱이) 자체와는 다른 개념입니다."},

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let userName = '', userSchool = '', userPhone = '';
let userAnswers = {}; // num → chosen index (1~4)
let timerInterval = null;
let elapsedSec = 0;
let quizStarted = false;

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function toast(msg, duration = 2500) {
  const el = document.getElementById('savingToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ══════════════════════════════════════
// SCREEN 1 → 시작
// ══════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교를 입력해주세요.'); return; }
  if (!/^[0-9]{4}$/.test(phone)) { alert('전화번호 뒷자리 4자리(숫자)를 입력해주세요.'); return; }

  userName = name;
  userSchool = school;
  userPhone = phone;
  userAnswers = {};
  elapsedSec = 0;

  renderQuiz();
  showScreen('screen-quiz');
  startTimer();
}

// ══════════════════════════════════════
// 타이머
// ══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(elapsedSec);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

// ══════════════════════════════════════
// 퀴즈 렌더
// ══════════════════════════════════════
const LABELS = ['①','②','③','④'];

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = QUIZ.map(q => `
    <div class="q-card" id="qcard-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="q-options">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="opt-${q.num}-${i+1}" onclick="selectOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');
  updateProgress();
}

function selectOpt(num, chosen) {
  userAnswers[num] = chosen;

  // 선택 표시
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`opt-${num}-${i}`);
    btn.style.borderColor = i === chosen ? 'var(--accent)' : '';
    btn.style.background = i === chosen ? 'var(--accent-light)' : '';
  }
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const total = QUIZ.length;
  document.getElementById('metaProgress').textContent = `${answered} / ${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

// ══════════════════════════════════════
// 제출
// ══════════════════════════════════════
function submitQuiz() {
  const answered = Object.keys(userAnswers).length;
  if (answered < QUIZ.length) {
    if (!confirm(`아직 ${QUIZ.length - answered}문제가 남아 있어요. 제출하시겠어요?`)) return;
  }
  stopTimer();
  showResult();
}

// ══════════════════════════════════════
// 결과
// ══════════════════════════════════════
function showResult() {
  const correct = QUIZ.filter(q => userAnswers[q.num] === q.ans);
  const wrong   = QUIZ.filter(q => userAnswers[q.num] !== q.ans);
  const score   = correct.length;
  const total   = QUIZ.length;

  document.getElementById('resultName').textContent = `${userName} · ${userSchool} · ${userPhone}`;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultScoreSub').textContent = `/ ${total} 문항`;
  document.getElementById('statTime').textContent = fmtTime(elapsedSec);
  document.getElementById('statCorrect').textContent = `${score}개`;
  document.getElementById('statWrong').textContent = `${wrong.length}개`;

  // 오답 리뷰
  const reviewSection = document.getElementById('reviewSection');
  if (wrong.length === 0) {
    reviewSection.innerHTML = `<div style="text-align:center;padding:32px 0;color:var(--accent);font-weight:700;">🎉 전부 맞혔어요!</div>`;
  } else {
    reviewSection.innerHTML = `
      <h2>틀린 문제 <span class="badge-wrong">${wrong.length}문제</span></h2>
      ${wrong.map(q => renderReviewCard(q)).join('')}
    `;
  }

  showScreen('screen-result');
  saveScore(score, total);
}

function renderReviewCard(q) {
  return `
    <div class="review-card" id="review-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="review-retry-wrap" id="retry-opts-${q.num}">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="retry-opt-${q.num}-${i+1}" onclick="retryOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="review-exp">
        <div class="review-exp-label">✦ 해설</div>
        <p>${q.exp}</p>
      </div>
    </div>
  `;
}

function retryOpt(num, chosen) {
  const q = QUIZ.find(x => x.num === num);
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`retry-opt-${num}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.ans) btn.className = 'opt-btn correct';
    else if (i === chosen && chosen !== q.ans) btn.className = 'opt-btn wrong';
    else btn.className = 'opt-btn reveal';
  }
}

// ══════════════════════════════════════
// 점수 저장 (Google Sheets 주 저장소 + Airtable 병행)
// ══════════════════════════════════════
function buildPayload(score, total) {
  return {
    '이름': userName,
    '학교': userSchool,
    'phone_last4': userPhone,
    '날짜': new Date().toISOString().split('T')[0],
    '과목코드': QUIZ_META.subjectCode,
    '과목명': QUIZ_META.subjectName,
    '대단원번호': QUIZ_META.mainNo,
    '대단원명': QUIZ_META.mainName,
    '중단원번호': QUIZ_META.subNo,
    '중단원명': QUIZ_META.subName,
    '섹션번호': QUIZ_META.sectionNo,
    '섹션명': QUIZ_META.sectionName,
    '총점': score,
    '총문항수': total,
    '풀이시간': fmtTime(elapsedSec)
  };
}

async function saveToSheets(payload) {
  // Content-Type을 text/plain 으로 보내야 preflight(OPTIONS)가 생기지 않음.
  // Apps Script 웹앱은 OPTIONS를 처리하지 못하므로 이 설정이 필수.
  const res = await fetch(GS_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.ok !== true) throw new Error(data.error || 'sheets rejected');
  return data;
}

async function saveToAirtable(payload) {
  const res = await fetch(`https://api.airtable.com/v0/${AT_BASE}/${AT_SCORES}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${AT_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ fields: payload })
  });
  if (!res.ok) throw new Error('airtable ' + res.status);
  return true;
}

async function saveScore(score, total) {
  toast('점수 저장 중...');
  const payload = buildPayload(score, total);

  const jobs = [saveToSheets(payload)];
  if (DUAL_WRITE) jobs.push(saveToAirtable(payload));

  const results = await Promise.allSettled(jobs);
  const sheetsOk   = results[0].status === 'fulfilled';
  const airtableOk = DUAL_WRITE ? results[1].status === 'fulfilled' : false;

  if (!sheetsOk) console.warn('[Sheets 저장 실패]', results[0].reason);
  if (DUAL_WRITE && !airtableOk) console.warn('[Airtable 저장 실패]', results[1].reason);

  if (sheetsOk || airtableOk) {
    toast('✓ 점수가 저장되었습니다.');
  } else {
    toast('저장 실패 — 네트워크를 확인해주세요.');
  }
}

// ══════════════════════════════════════
// 리셋
// ══════════════════════════════════════
function resetQuiz() {
  userName = '';
  userSchool = '';
  userPhone = '';
  userAnswers = {};
  elapsedSec = 0;
  document.getElementById('input-name').value = '';
  document.getElementById('input-school').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('timerDisplay').textContent = '00:00';
  showScreen('screen-intro');
}
</script>
