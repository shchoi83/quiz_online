<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>탄성파 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

.screen { display: none; }
.screen.active { display: block; }

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 14px 28px;
  font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-ghost:hover { background: var(--accent-light); opacity: 1; }

#screen-intro {
  padding-top: 80px;
}

.intro-header {
  text-align: center;
  margin-bottom: 48px;
}

.intro-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

.intro-header h1 {
  margin-bottom: 12px;
}

.intro-header p {
  color: var(--text-dim);
  font-size: 0.92rem;
}

.intro-form {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

.form-group:last-child {
  margin-bottom: 0;
}

.form-group label {
  display: block;
  font-size: 0.9rem;
  font-weight: 500;
  margin-bottom: 8px;
  color: var(--text);
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.95rem;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

#screen-quiz {
  padding-top: 40px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 32px;
}

.quiz-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 12px;
  letter-spacing: 0.08em;
}

.quiz-header h1 {
  margin-bottom: 8px;
}

.quiz-header p {
  color: var(--text-dim);
  font-size: 0.88rem;
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 32px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease;
}

.question-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.question-number {
  font-family: 'DM Mono', monospace;
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 12px;
  letter-spacing: 0.04em;
}

.question-text {
  font-size: 1.15rem;
  font-weight: 500;
  margin-bottom: 24px;
  line-height: 1.5;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option {
  display: flex;
  align-items: center;
  padding: 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface);
}

.option:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}

.option input[type="radio"] {
  width: 20px;
  height: 20px;
  margin-right: 16px;
  cursor: pointer;
}

.option label {
  flex: 1;
  cursor: pointer;
  font-size: 0.95rem;
}

.option.selected {
  border-color: var(--accent);
  background: var(--accent-light);
}

.option.correct {
  border-color: var(--correct);
  background: var(--correct-light);
}

.option.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
}

.explanation {
  background: #f0f4f8;
  border-left: 4px solid var(--accent);
  padding: 16px;
  border-radius: 8px;
  margin-top: 20px;
  font-size: 0.9rem;
  line-height: 1.6;
}

.explanation-label {
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
}

.quiz-controls {
  display: flex;
  gap: 12px;
  margin-top: 32px;
}

.quiz-controls button {
  flex: 1;
}

#screen-result {
  padding-top: 60px;
  text-align: center;
}

.result-icon {
  font-size: 4rem;
  margin-bottom: 20px;
}

.result-score {
  font-size: 3rem;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 12px;
}

.result-text {
  font-size: 1.2rem;
  margin-bottom: 40px;
  color: var(--text-dim);
}

.result-details {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 32px;
  box-shadow: var(--shadow);
  text-align: left;
}

.detail-item {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.detail-item:last-child {
  border-bottom: none;
}

.detail-label {
  font-weight: 500;
}

.detail-value {
  color: var(--accent);
  font-weight: 600;
}

.footer-note {
  text-align: center;
  margin-top: 48px;
  font-size: 0.78rem;
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.04em;
}
</style>
</head>
<body>

<div class="container">

  <!-- SCREEN 1: 입력 -->
  <div class="screen active" id="screen-intro">
    <div class="intro-header">
      <div class="tag">MEC · 3-1-2</div>
      <h1>탄성파</h1>
      <p>역학과 에너지 · 3단원 탄성파와소리 · 1중단원 탄성파와 성질 · 2섹션</p>
    </div>

    <div class="intro-form">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="학생 이름을 입력하세요">
      </div>
      <div class="form-group">
        <label for="mode">모드 선택</label>
        <select id="mode">
          <option value="all">전체 문제 (40개)</option>
          <option value="ba">Basic만 (32개)</option>
          <option value="all">Advanced 포함 (40개)</option>
        </select>
      </div>
      <div class="form-group">
        <button class="btn" onclick="startQuiz()">퀴즈 시작</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: 퀴즈 -->
  <div class="screen" id="screen-quiz">
    <div class="quiz-header">
      <div class="tag">MEC · 3-1-2 탄성파</div>
      <h1>탄성파</h1>
      <p id="headerText"></p>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="question-box">
      <div class="question-number">문제 <span id="qNum"></span> / <span id="qTotal"></span></div>
      <div class="question-text" id="questionText"></div>
      
      <div class="options" id="optionsContainer"></div>

      <div class="explanation" id="explanationBox" style="display:none;">
        <div class="explanation-label">해설</div>
        <div id="explanationText"></div>
      </div>

      <div class="quiz-controls">
        <button class="btn btn-ghost" id="prevBtn" onclick="prevQuestion()">이전</button>
        <button class="btn" id="nextBtn" onclick="nextQuestion()">다음</button>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: 결과 -->
  <div class="screen" id="screen-result">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-text" id="resultText"></div>
    
    <div class="result-details">
      <div class="detail-item">
        <span class="detail-label">푼 문제</span>
        <span class="detail-value" id="answeredCount">0 / 40</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">정답</span>
        <span class="detail-value" id="correctCount">0개</span>
      </div>
      <div class="detail-item">
        <span class="detail-label">정답률</span>
        <span class="detail-value" id="correctRate">0%</span>
      </div>
    </div>

    <button class="btn" onclick="location.reload()">다시 시작</button>
  </div>

  <div class="footer-note">궁극의 물리 · 최성훈T</div>
</div>

<script>
const quizData = {"quizCode": "mec-3-1-2-wave", "subjectCode": "MEC", "subjectName": "\uc5ed\ud559\uacfc \uc5d0\ub108\uc9c0", "mainNo": "3", "mainName": "\ud0c4\uc131\ud30c\uc640\uc18c\ub9ac", "subNo": "1", "subName": "\ud0c4\uc131\ud30c\uc640 \uc131\uc9c8", "sectionNo": "2", "sectionName": "\ud0c4\uc131\ud30c", "totalQuestions": 40, "questions": [{"num": 138, "text": "\ud30c\ub3d9\uc758 \uc815\uc758\ub85c \uac00\uc7a5 \uc801\uc808\ud55c \uac83\uc740?", "opts": ["\ubb3c\uc9c8\uc774 \ud55c \uc9c0\uc810\uc5d0\uc11c \ub2e4\ub978 \uc9c0\uc810\uc73c\ub85c \uc774\ub3d9\ud558\ub294 \ud604\uc0c1", "\ub9e4\uc9c8\uc758 \uac01 \ubd80\ubd84\uc774 \uc81c\uc790\ub9ac\uc5d0\uc11c \uc9c4\ub3d9\ud558\uba74\uc11c \uc5d0\ub108\uc9c0\ub9cc \uc804\ub2ec\ub418\ub294 \ud604\uc0c1", "\uc5d0\ub108\uc9c0\uac00 \ub9e4\uc9c8\uc744 \ud1b5\ud574 \ud769\uc5b4\uc9c0\uba74\uc11c \uac10\uc18c\ud558\ub294 \ud604\uc0c1", "\ub9e4\uc9c8\uc758 \ubc00\ub3c4 \ubcc0\ud654\ub85c \uc778\ud574 \ubc1c\uc0dd\ud558\ub294 \ud604\uc0c1"], "ans": 2, "exp": "\ud30c\ub3d9\uc740 \ub9e4\uc9c8\uc758 \uac01 \ubd80\ubd84\uc774 \uc81c\uc790\ub9ac\uc5d0\uc11c \uc9c4\ub3d9(\ub5a8\ub9bc)\ud558\uba74\uc11c \uc5d0\ub108\uc9c0\uc640 \uc6b4\ub3d9\ub7c9\ub9cc \uc804\ub2ec\ub418\ub294 \ud604\uc0c1\uc785\ub2c8\ub2e4. \ub9e4\uc9c8 \uc790\uc2e0\uc740 \uc774\ub3d9\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4."}, {"num": 139, "text": "\ud0c4\uc131\ud30c\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\uc5d0\ub108\uc9c0\uac00 \uad11\uc18d\uc73c\ub85c \uc804\ud30c\ub418\ub294 \ud30c\ub3d9", "\ud0c4\uc131\uc744 \uc9c0\ub2cc \ub9e4\uc9c8\uc744 \ud1b5\ud574 \uc804\ub2ec\ub418\ub294 \ud30c\ub3d9", "\uc9c4\uacf5\uc5d0\uc11c\ub3c4 \uc804\ud30c\ub420 \uc218 \uc788\ub294 \ud30c\ub3d9", "\ube5b\uc758 \uc18d\ub3c4\ub85c \ubaa8\ub4e0 \ubb3c\uc9c8\uc744 \ud1b5\uacfc\ud558\ub294 \ud30c\ub3d9"], "ans": 2, "exp": "\ud0c4\uc131\ud30c\ub294 \ud0c4\uc131\uc744 \uc9c0\ub2cc \ub9e4\uc9c8(\uace0\uccb4, \uc561\uccb4, \uae30\uccb4)\uc744 \ud1b5\ud574 \uc804\ub2ec\ub418\ub294 \ud30c\ub3d9\uc785\ub2c8\ub2e4. \uc9c4\uacf5\uc5d0\uc11c\ub294 \uc804\ud30c\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4."}, {"num": 140, "text": "\ub2e4\uc74c \uc911 \ub9e4\uc9c8\uc774 \ud544\uc694\ud558\uc9c0 \uc54a\uc740 \ud30c\ub3d9\uc740?", "opts": ["\uc74c\ud30c", "\uc218\uba74\ud30c", "\uc9c0\uc9c4\ud30c", "\uc804\uc790\uae30\ud30c(\ube5b)"], "ans": 4, "exp": "\uc804\uc790\uae30\ud30c(\ube5b)\ub294 \ub9e4\uc9c8\uc774 \uc5c6\uc5b4\ub3c4 \uc9c4\uacf5\uc5d0\uc11c \uc804\ud30c\ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc74c\ud30c, \uc218\uba74\ud30c, \uc9c0\uc9c4\ud30c\ub294 \ubaa8\ub450 \ud0c4\uc131\ud30c\ub85c \ub9e4\uc9c8\uc774 \ud544\uc694\ud569\ub2c8\ub2e4."}, {"num": 141, "text": "\ub9e4\uc9c8\uc774 \ud544\uc694\ud55c \ud30c\ub3d9\uc758 \uc608\ub85c \uc62c\ubc14\ub978 \uc870\ud569\uc740?", "opts": ["\uc218\uba74\ud30c, \uc74c\ud30c, \ube5b", "\uc9c0\uc9c4\ud30c, \uc74c\ud30c, \ube5b", "\uc218\uba74\ud30c, \uc9c0\uc9c4\ud30c, \uc74c\ud30c", "\uc74c\ud30c, \ube5b, \ub9c8\uc774\ud06c\ub85c\ud30c"], "ans": 3, "exp": "\uc218\uba74\ud30c(\ubb3c\uc758 \ud0c4\uc131), \uc9c0\uc9c4\ud30c(\uc9c0\uac01\uc758 \ud0c4\uc131), \uc74c\ud30c(\uacf5\uae30\uc758 \ud0c4\uc131)\ub294 \ubaa8\ub450 \ub9e4\uc9c8\uc774 \ud544\uc694\ud55c \ud0c4\uc131\ud30c\uc785\ub2c8\ub2e4."}, {"num": 142, "text": "\ud30c\ub3d9\uc774 \uc9c4\ud589\ud558\uae30 \uc704\ud574 \ud544\uc694\ud55c \uac00\uc7a5 \uae30\ubcf8\uc801\uc778 \uc870\uac74\uc740?", "opts": ["\ub192\uc740 \uc628\ub3c4", "\ud0c4\uc131\uc744 \uc9c0\ub2cc \ub9e4\uc9c8", "\uad11\uc6d0", "\uac15\ud55c \uc555\ub825"], "ans": 2, "exp": "\ud0c4\uc131\ud30c\uac00 \uc9c4\ud589\ud558\ub824\uba74 \ud0c4\uc131\uc744 \uc9c0\ub2cc \ub9e4\uc9c8\uc774 \ud544\uc218\uc801\uc785\ub2c8\ub2e4. \ub9e4\uc9c8\uc774 \uc5c6\uc73c\uba74 \ud30c\ub3d9\uc774 \uc804\ud30c\ub420 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4."}, {"num": 143, "text": "\ub2e4\uc74c \uc911 \ud0c4\uc131\ud30c\uc5d0 \ud574\ub2f9\ud558\ub294 \uac83\uc740?", "opts": ["\ud0dc\uc591 \ube5b", "\ub77c\ub514\uc624\ud30c", "\uc74c\ud30c", "\uc790\uc678\uc120"], "ans": 3, "exp": "\uc74c\ud30c\ub294 \uacf5\uae30\uc758 \ud0c4\uc131\uc5d0 \uc758\ud574 \uc804\ud30c\ub418\ub294 \ud0c4\uc131\ud30c\uc785\ub2c8\ub2e4. \ub098\uba38\uc9c0\ub294 \ubaa8\ub450 \ub9e4\uc9c8 \uc5c6\uc774\ub3c4 \uc804\ud30c\ub418\ub294 \uc804\uc790\uae30\ud30c\uc785\ub2c8\ub2e4."}, {"num": 144, "text": "\uc9c0\uad6c\uc0c1\uc758 \ubaa8\ub4e0 \ud0c4\uc131\ud30c\uc758 \uacf5\ud1b5\uc810\uc740?", "opts": ["\ubaa8\ub450 \uac19\uc740 \uc18d\ub825\uc73c\ub85c \uc9c4\ud589\ud55c\ub2e4", "\ubaa8\ub450 \uc9c4\uacf5\uc5d0\uc11c\ub3c4 \uc804\ud30c\ub41c\ub2e4", "\ubaa8\ub450 \ud0c4\uc131\uc744 \uc9c0\ub2cc \ub9e4\uc9c8\uc744 \ud544\uc694\ub85c \ud55c\ub2e4", "\ubaa8\ub450 \ud6a1\ud30c\uc774\ub2e4"], "ans": 3, "exp": "\ubaa8\ub4e0 \ud0c4\uc131\ud30c\ub294 \ud0c4\uc131\uc744 \uc9c0\ub2cc \ub9e4\uc9c8\uc744 \ud1b5\ud574\uc11c\ub9cc \uc804\ud30c\ub429\ub2c8\ub2e4. \uc774\uac83\uc774 \ud0c4\uc131\ud30c\uc758 \uc815\uc758\uc801 \ud2b9\uc131\uc785\ub2c8\ub2e4."}, {"num": 145, "text": "\ud30c\ub3d9\uc774 \uc804\ub2ec\ud558\ub294 \uac83\uc73c\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ubb3c\uc9c8 \uc790\uccb4", "\uc5d0\ub108\uc9c0\uc640 \uc6b4\ub3d9\ub7c9", "\uc6d0\uc790\uc640 \ubd84\uc790", "\ube5b\uacfc \uc18c\ub9ac"], "ans": 2, "exp": "\ud30c\ub3d9\uc740 \ub9e4\uc9c8\uc758 \uac01 \ubd80\ubd84\uc774 \uc81c\uc790\ub9ac\uc5d0\uc11c \uc9c4\ub3d9\ud558\uba74\uc11c \uc5d0\ub108\uc9c0\uc640 \uc6b4\ub3d9\ub7c9\uc744 \uc804\ub2ec\ud569\ub2c8\ub2e4. \ub9e4\uc9c8 \uc790\uccb4\ub294 \uc774\ub3d9\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4."}, {"num": 146, "text": "\ud6a1\ud30c\uc758 \uc815\uc758\ub85c \uac00\uc7a5 \uc801\uc808\ud55c \uac83\uc740?", "opts": ["\ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5\uacfc \ub9e4\uc9c8\uc758 \uc9c4\ub3d9 \ubc29\ud5a5\uc774 \ub098\ub780\ud55c \ud30c\ub3d9", "\ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5\uacfc \ub9e4\uc9c8\uc758 \uc9c4\ub3d9 \ubc29\ud5a5\uc774 \uc218\uc9c1\uc778 \ud30c\ub3d9", "\uc74c\ud30c\uc640 \uac19\uc740 \uc885\ub958\uc758 \ud30c\ub3d9", "\uc9c0\uc9c4\ud30c \uc911 P\ud30c\ub77c\uace0 \ubd88\ub9ac\ub294 \ud30c\ub3d9"], "ans": 2, "exp": "\ud6a1\ud30c\ub294 \ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5(\u2190\u2192)\uacfc \ub9e4\uc9c8\uc758 \uc9c4\ub3d9 \ubc29\ud5a5(\u2191\u2193)\uc774 \uc218\uc9c1\uc785\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-6 (\uac00)\ub97c \ucc38\uace0\ud558\uc138\uc694."}, {"num": 147, "text": "\uc885\ud30c\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5\uacfc \ub9e4\uc9c8\uc758 \uc9c4\ub3d9 \ubc29\ud5a5\uc774 \uc218\uc9c1\uc778 \ud30c\ub3d9", "\ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5\uacfc \ub9e4\uc9c8\uc758 \uc9c4\ub3d9 \ubc29\ud5a5\uc774 \ub098\ub780\ud55c \ud30c\ub3d9", "\ubb3c\uc758 \ud45c\uba74\uc5d0\uc11c\ub9cc \ubc1c\uc0dd\ud558\ub294 \ud30c\ub3d9", "\ud56d\uc0c1 \ub9e4\uc9c8\uc774 \uc5c6\uc5b4\uc57c \uc9c4\ud589\ub418\ub294 \ud30c\ub3d9"], "ans": 2, "exp": "\uc885\ud30c\ub294 \ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5(\u2190\u2192)\uacfc \ub9e4\uc9c8\uc758 \uc9c4\ub3d9 \ubc29\ud5a5(\u2190\u2192)\uc774 \ub098\ub780\ud569\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-6 (\ub098)\ub97c \ucc38\uace0\ud558\uc138\uc694."}, {"num": 148, "text": "\uc218\uba74\ud30c(\uc218\uc704\uc758 \uc0c1\ud558 \uc9c4\ub3d9)\uc758 \ubd84\ub958\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\uc885\ud30c", "\ud6a1\ud30c", "\uc885\ud6a1\ud30c\uc758 \ud63c\ud569", "\uc815\uc0c1\ud30c"], "ans": 2, "exp": "\uc218\uba74\ud30c\ub294 \uc218\uc704\uac00 \uc704\uc544\ub798(\u2191\u2193)\ub85c \uc9c4\ub3d9\ud558\uba74\uc11c \ud30c\ub3d9\uc774 \uc606(\u2190\u2192)\uc73c\ub85c \uc9c4\ud589\ud558\ubbc0\ub85c \ud6a1\ud30c\uc785\ub2c8\ub2e4."}, {"num": 149, "text": "\uc9c0\uc9c4\ud30c \uc911 S\ud30c(\ud6a1\ud30c)\uc758 \ud2b9\uc9d5\uc73c\ub85c \uc62c\ubc14\ub978 \uac83\uc740?", "opts": ["\uace0\uccb4, \uc561\uccb4, \uae30\uccb4\ub97c \ubaa8\ub450 \ud1b5\uacfc\ud55c\ub2e4", "\uc9c0\uc9c4\ud30c \uc911 \uac00\uc7a5 \ube60\ub974\ub2e4", "\uace0\uccb4\ub9cc \ud1b5\uacfc\ud558\uace0 \uc561\uccb4\ub294 \ud1b5\uacfc\ud558\uc9c0 \ubabb\ud55c\ub2e4", "\uc74c\ud30c\uc640 \uac19\uc740 \uc18d\ub825\uc73c\ub85c \uc9c4\ud589\ud55c\ub2e4"], "ans": 3, "exp": "\uc9c0\uc9c4\ud30c \uc911 S\ud30c\ub294 \ud6a1\ud30c\ub85c\uc11c \uace0\uccb4\uc5d0\uc11c\ub9cc \uc804\ud30c\ub429\ub2c8\ub2e4. \uc561\uccb4 \uc678\ud575\uc5d0\uc11c S\ud30c\uac00 \ub098\ud0c0\ub098\uc9c0 \uc54a\ub294 \uc774\uc720\uc785\ub2c8\ub2e4."}, {"num": 150, "text": "\uc9c0\uc9c4\ud30c \uc911 P\ud30c(\uc885\ud30c)\uc758 \ud2b9\uc9d5\uc73c\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\uace0\uccb4\uc5d0\uc11c\ub9cc \uc804\ud30c\ub41c\ub2e4", "\uc561\uccb4\ub97c \ud1b5\uacfc\ud558\uc9c0 \ubabb\ud55c\ub2e4", "\uace0\uccb4, \uc561\uccb4, \uae30\uccb4\ub97c \ubaa8\ub450 \ud1b5\uacfc\ud55c\ub2e4", "S\ud30c\ubcf4\ub2e4 \ub290\ub9ac\uac8c \uc9c4\ud589\ud55c\ub2e4"], "ans": 3, "exp": "\uc9c0\uc9c4\ud30c \uc911 P\ud30c\ub294 \uc885\ud30c\ub85c\uc11c \uace0\uccb4, \uc561\uccb4, \uae30\uccb4\ub97c \ubaa8\ub450 \ud1b5\uacfc\ud569\ub2c8\ub2e4. P\ud30c\uac00 S\ud30c\ubcf4\ub2e4 \ube60\ub974\uace0 \uba3c\uc800 \ub3c4\ub2ec\ud569\ub2c8\ub2e4."}, {"num": 151, "text": "\uc74c\ud30c\uc758 \ubd84\ub958\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ud6a1\ud30c (\uacf5\uae30\uc758 \uc555\ucd95\uacfc \ud33d\ucc3d\uc774 \uc9c4\ud589 \ubc29\ud5a5\uacfc \uc218\uc9c1)", "\uc885\ud30c (\uacf5\uae30\uc758 \uc555\ucd95\uacfc \ud33d\ucc3d\uc774 \uc9c4\ud589 \ubc29\ud5a5\uacfc \ub098\ub780\ud568)", "\ud6a1\ud30c\uc640 \uc885\ud30c\uc758 \ud63c\ud569", "\uc815\uc0c1\ud30c\uc640 \uc9c4\ud589\ud30c\uc758 \uc870\ud569"], "ans": 2, "exp": "\uc74c\ud30c\ub294 \uacf5\uae30\uc758 \uc555\ucd95(\ub192\uc740 \uc555\ub825)\uacfc \ud33d\ucc3d(\ub0ae\uc740 \uc555\ub825)\uc774 \uc74c\ud30c\uc758 \uc9c4\ud589 \ubc29\ud5a5\uacfc \ub098\ub780\ud558\uac8c \uc77c\uc5b4\ub098\ubbc0\ub85c \uc885\ud30c\uc785\ub2c8\ub2e4."}, {"num": 152, "text": "\ub2e4\uc74c \uc911 \ud6a1\ud30c\uc758 \uc608\ub85c \uc62c\ubc14\ub978 \uac83\uc740?", "opts": ["\uc74c\ud30c", "\uc74c\ud5a5\ud30c", "\ucd08\uc74c\ud30c", "\uc218\uba74\ud30c"], "ans": 4, "exp": "\uc218\uba74\ud30c\ub294 \ubb3c\uc758 \ud45c\uba74\uc774 \uc704\uc544\ub798\ub85c \uc9c4\ub3d9\ud558\uba74\uc11c \ud30c\ub3d9\uc774 \uc606\uc73c\ub85c \uc9c4\ud589\ud558\ubbc0\ub85c \ud6a1\ud30c\uc785\ub2c8\ub2e4. \uc74c\ud30c, \uc74c\ud5a5\ud30c, \ucd08\uc74c\ud30c\ub294 \ubaa8\ub450 \uc885\ud30c\uc785\ub2c8\ub2e4."}, {"num": 153, "text": "\ub2e4\uc74c \uc911 \uc885\ud30c\uc758 \uc608\ub85c \uc62c\ubc14\ub978 \uac83\uc740?", "opts": ["\uc9c0\uc9c4\ud30c\uc758 S\ud30c", "\uc218\uba74\ud30c", "\uc904\uc758 \ud30c\ub3d9", "\uc74c\ud30c"], "ans": 4, "exp": "\uc74c\ud30c\ub294 \uc885\ud30c\uc785\ub2c8\ub2e4. S\ud30c\ub294 \ud6a1\ud30c, \uc218\uba74\ud30c\uc640 \uc904\uc758 \ud30c\ub3d9\ub3c4 \ud6a1\ud30c\uc785\ub2c8\ub2e4."}, {"num": 154, "text": "\ud30c\ub3d9\uc758 '\ub9c8\ub8e8'\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ud30c\ub3d9\uc774 \uac00\uc7a5 \ub0ae\uc740 \uc704\uce58", "\ub9e4\uc9c8\uc758 \uc9c4\ub3d9\uc774 \uc544\ub798\ucabd \uadf9\ub2e8\uc778 \uc810", "\ub9e4\uc9c8\uc758 \uc9c4\ub3d9\uc774 \uc704\ucabd \uadf9\ub2e8\uc778 \uc810", "\ud30c\ub3d9\uc758 \uc911\uc559\uc120"], "ans": 3, "exp": "\ub9c8\ub8e8\ub294 \ub9e4\uc9c8\uc758 \uc9c4\ub3d9\uc774 \uc704\ucabd \uadf9\ub2e8\uc5d0 \ub3c4\ub2ec\ud55c \uc810\uc785\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-7 (\uac00)\uc5d0\uc11c \ub9c8\ub8e8\ub97c \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4."}, {"num": 155, "text": "\ud30c\ub3d9\uc758 '\uace8'\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ub9e4\uc9c8\uc758 \uc9c4\ub3d9\uc774 \uc704\ucabd \uadf9\ub2e8\uc778 \uc810", "\ud30c\ub3d9\uc758 \uc9c4\ud589 \ubc29\ud5a5", "\ub9e4\uc9c8\uc758 \uc9c4\ub3d9\uc774 \uc544\ub798\ucabd \uadf9\ub2e8\uc778 \uc810", "\ud30c\ub3d9\uc758 \uc18d\ub825"], "ans": 3, "exp": "\uace8\uc740 \ub9e4\uc9c8\uc758 \uc9c4\ub3d9\uc774 \uc544\ub798\ucabd \uadf9\ub2e8\uc5d0 \ub3c4\ub2ec\ud55c \uc810\uc785\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-7 (\uac00)\uc5d0\uc11c \uace8\uc744 \ud655\uc778\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4."}, {"num": 156, "text": "\ud30c\ub3d9\uc758 '\uc9c4\ud3ed'\uc758 \uc815\uc758\ub85c \uac00\uc7a5 \uc801\uc808\ud55c \uac83\uc740?", "opts": ["\ub9c8\ub8e8\uc5d0\uc11c \uace8\uae4c\uc9c0\uc758 \uac70\ub9ac", "\ub9c8\ub8e8\uc5d0\uc11c \uc911\uc559\uc120\uae4c\uc9c0\uc758 \uac70\ub9ac", "\ud30c\ub3d9\uc774 \uc9c4\ud589\ud558\ub294 \uac70\ub9ac", "\ud30c\ub3d9\uc774 \ud55c \uc8fc\uae30\uc5d0 \uc9c4\ud589\ud558\ub294 \uac70\ub9ac"], "ans": 2, "exp": "\uc9c4\ud3ed(A)\uc740 \ub9c8\ub8e8(\ub610\ub294 \uace8)\uc5d0\uc11c \uc911\uc559\uc120\uae4c\uc9c0\uc758 \ucd5c\ub300 \ubcc0\uc704\uc785\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-7 (\uac00)\ub97c \ucc38\uace0\ud558\uc138\uc694."}, {"num": 157, "text": "\ud30c\ub3d9\uc758 '\ud30c\uc7a5'\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ub9c8\ub8e8\uc640 \ub2e4\uc74c \ub9c8\ub8e8 \uc0ac\uc774\uc758 \uac70\ub9ac", "\ud55c \ubc88\uc758 \uc9c4\ub3d9\uc5d0 \uc18c\uc694\ub418\ub294 \uc2dc\uac04", "1\ucd08 \ub3d9\uc548 \uc77c\uc5b4\ub098\ub294 \uc9c4\ub3d9\uc758 \ud69f\uc218", "\ud30c\ub3d9\uc774 \uc9c4\ud589\ud558\ub294 \uc18d\ub825"], "ans": 1, "exp": "\ud30c\uc7a5(\u03bb)\uc740 \ub9c8\ub8e8\uc5d0\uc11c \ub2e4\uc74c \ub9c8\ub8e8\uae4c\uc9c0, \ub610\ub294 \uace8\uc5d0\uc11c \ub2e4\uc74c \uace8\uae4c\uc9c0\uc758 \uac70\ub9ac\uc785\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-7 (\uac00)\ub97c \ucc38\uace0\ud558\uc138\uc694."}, {"num": 158, "text": "\ud30c\ub3d9\uc758 '\uc8fc\uae30'\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["1\ucd08 \ub3d9\uc548 \uc77c\uc5b4\ub098\ub294 \uc9c4\ub3d9\uc758 \ud69f\uc218", "\ud55c \ubc88\uc758 \uc9c4\ub3d9\uc5d0 \uc18c\uc694\ub418\ub294 \uc2dc\uac04", "\ud30c\ub3d9\uc774 \ud30c\uc7a5\ub9cc\ud07c \uc9c4\ud589\ud558\ub294 \uc2dc\uac04", "\ub9c8\ub8e8\uc758 \uac1c\uc218"], "ans": 2, "exp": "\uc8fc\uae30(T)\ub294 \ud55c \ubc88\uc758 \uc644\uc804\ud55c \uc9c4\ub3d9(\uc608: \ub9c8\ub8e8\u2192\uace8\u2192\ub9c8\ub8e8)\uc5d0 \ud544\uc694\ud55c \uc2dc\uac04\uc785\ub2c8\ub2e4."}, {"num": 159, "text": "\ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504(\ud55c \uc21c\uac04\uc758 \ud30c\ub3d9 \ubaa8\uc2b5)\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\ub294 \ubb3c\ub9ac\ub7c9\uc740?", "opts": ["\uc9c4\ub3d9\uc218, \uc8fc\uae30", "\ud30c\uc7a5, \uc9c4\ud3ed", "\uc18d\ub825, \uac00\uc18d\ub3c4", "\uc2dc\uac04, \uac01\uc18d\ub3c4"], "ans": 2, "exp": "\ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504\ub294 \ud55c \uc21c\uac04\uc758 \uacf5\uac04\uc801 \ubaa8\uc2b5\uc744 \ub098\ud0c0\ub0b4\ubbc0\ub85c \ud30c\uc7a5\uacfc \uc9c4\ud3ed\uc744 \uc77d\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-7 (\uac00)\uc785\ub2c8\ub2e4."}, {"num": 160, "text": "\ubcc0\uc704-\uc2dc\uac04 \uadf8\ub798\ud504(\ud55c \uc810\uc758 \uc9c4\ub3d9 \uacfc\uc815)\uc5d0\uc11c \ud655\uc778\ud560 \uc218 \uc788\ub294 \ubb3c\ub9ac\ub7c9\uc740?", "opts": ["\ud30c\uc7a5, \uc9c4\ud3ed, \uc18d\ub825", "\uc8fc\uae30, \uc9c4\ub3d9\uc218, \uc9c4\ud3ed", "\ud30c\uc7a5, \uc8fc\uae30, \uc18d\ub825", "\uc9c4\ub3d9\uc218, \uc18d\ub825, \ud30c\uc7a5"], "ans": 2, "exp": "\ubcc0\uc704-\uc2dc\uac04 \uadf8\ub798\ud504\ub294 \ud55c \uc810\uc758 \uc2dc\uac04\uc801 \ubcc0\ud654\ub97c \ub098\ud0c0\ub0b4\ubbc0\ub85c \uc8fc\uae30, \uc9c4\ub3d9\uc218, \uc9c4\ud3ed\uc744 \uc77d\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-7 (\ub098)\uc785\ub2c8\ub2e4."}, {"num": 161, "text": "\ud30c\ub3d9\uc758 \ud45c\ud604\uc5d0\uc11c \ub9c8\ub8e8, \uace8, \uc9c4\ud3ed, \ud30c\uc7a5, \uc8fc\uae30\ub97c \ubaa8\ub450 \ud45c\uc2dc\ud558\ub824\uba74?", "opts": ["\ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504\ub9cc \ud544\uc694", "\ubcc0\uc704-\uc2dc\uac04 \uadf8\ub798\ud504\ub9cc \ud544\uc694", "\ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504\uc640 \ubcc0\uc704-\uc2dc\uac04 \uadf8\ub798\ud504 \ubaa8\ub450 \ud544\uc694", "\uadf8\ub798\ud504 \uc5c6\uc774 \uc218\uc2dd\uc73c\ub85c\ub9cc \uac00\ub2a5"], "ans": 3, "exp": "\ub9c8\ub8e8, \uace8, \uc9c4\ud3ed, \ud30c\uc7a5\uc740 \ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504\uc5d0\uc11c, \uc8fc\uae30\ub294 \ubcc0\uc704-\uc2dc\uac04 \uadf8\ub798\ud504\uc5d0\uc11c \ub098\ud0c0\ub0c5\ub2c8\ub2e4."}, {"num": 162, "text": "[\uc2ec\ud654] \uc8fc\uc5b4\uc9c4 \ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504\uc5d0\uc11c \ud30c\uc7a5\uc774 4m\uc774\uace0, \ubcc0\uc704-\uc2dc\uac04 \uadf8\ub798\ud504\uc5d0\uc11c \uc8fc\uae30\uac00 2\ucd08\uc778 \ud30c\ub3d9\uc758 \uc18d\ub825\uc740?", "opts": ["1 m/s", "2 m/s", "4 m/s", "8 m/s"], "ans": 2, "exp": "\ud30c\ub3d9\uc758 \uc18d\ub825 v = \u03bb/T = 4m / 2s = 2 m/s\uc785\ub2c8\ub2e4."}, {"num": 163, "text": "[\uc2ec\ud654] \ubcc0\uc704-\uc704\uce58 \uadf8\ub798\ud504\ub97c \ubcf4\uace0 \uc9c4\ud3ed\uc774 0.5m, \ud30c\uc7a5\uc774 2m\uc778 \ud30c\ub3d9\uc5d0\uc11c \uc9c4\ub3d9\uc218\uac00 10Hz\uc77c \ub54c\uc758 \uc18d\ub825\uc740?", "opts": ["5 m/s", "10 m/s", "20 m/s", "40 m/s"], "ans": 2, "exp": "\ud30c\ub3d9\uc758 \uc18d\ub825 v = \u03bbf = 2m \u00d7 10Hz = 20 m/s\uc785\ub2c8\ub2e4."}, {"num": 164, "text": "\uc9c4\ub3d9\uc218\uc758 \uc815\uc758\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ud55c \ubc88\uc758 \uc9c4\ub3d9\uc5d0 \uac78\ub9ac\ub294 \uc2dc\uac04", "1\ucd08 \ub3d9\uc548 \uc77c\uc5b4\ub098\ub294 \uc9c4\ub3d9\uc758 \ud69f\uc218", "\ud30c\ub3d9\uc774 \ud55c \uc8fc\uae30\uc5d0 \uc9c4\ud589\ud558\ub294 \uac70\ub9ac", "\uc9c4\ud3ed\uacfc \uc8fc\uae30\uc758 \uacf1"], "ans": 2, "exp": "\uc9c4\ub3d9\uc218(f)\ub294 1\ucd08 \ub3d9\uc548 \uc644\uc804\ud55c \uc9c4\ub3d9\uc774 \uba87 \ubc88 \uc77c\uc5b4\ub098\ub294\uc9c0\ub97c \ub098\ud0c0\ub0b4\uba70, \ub2e8\uc704\ub294 Hz(\ud5e4\ub974\uce20)\uc785\ub2c8\ub2e4."}, {"num": 165, "text": "\uc8fc\uae30(T)\uc640 \uc9c4\ub3d9\uc218(f)\uc758 \uad00\uacc4\uc2dd\uc73c\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["T = f", "T = 1/f", "T = 2f", "T = f\u00b2"], "ans": 2, "exp": "\uc8fc\uae30\uc640 \uc9c4\ub3d9\uc218\ub294 \uc5ed\uc218 \uad00\uacc4\uc785\ub2c8\ub2e4. T = 1/f, \ub610\ub294 f = 1/T\uc785\ub2c8\ub2e4."}, {"num": 166, "text": "\ud30c\ub3d9\uc758 \uc18d\ub825\uc744 \ub098\ud0c0\ub0b4\ub294 \uacf5\uc2dd\uc73c\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["v = \u03bbT", "v = \u03bb/f", "v = \u03bbf", "v = f/\u03bb"], "ans": 3, "exp": "\ud30c\ub3d9\uc758 \uc18d\ub825 v = \u03bbf = \u03bb/T\uc785\ub2c8\ub2e4. \ud30c\uc7a5\uc5d0 \uc9c4\ub3d9\uc218\ub97c \uacf1\ud558\uba74 \uc18d\ub825\uc785\ub2c8\ub2e4."}, {"num": 167, "text": "\uc8fc\uae30\uac00 0.1\ucd08\uc778 \ud30c\ub3d9\uc758 \uc9c4\ub3d9\uc218\ub294?", "opts": ["0.1 Hz", "1 Hz", "10 Hz", "100 Hz"], "ans": 3, "exp": "f = 1/T = 1/0.1 = 10 Hz\uc785\ub2c8\ub2e4."}, {"num": 168, "text": "\uc9c4\ub3d9\uc218\uac00 20Hz\uc774\uace0 \ud30c\uc7a5\uc774 0.5m\uc778 \ud30c\ub3d9\uc758 \uc18d\ub825\uc740?", "opts": ["5 m/s", "10 m/s", "20 m/s", "40 m/s"], "ans": 2, "exp": "v = \u03bbf = 0.5m \u00d7 20Hz = 10 m/s\uc785\ub2c8\ub2e4."}, {"num": 169, "text": "\ud30c\ub3d9\uc758 \uc18d\ub825\uc774 340m/s\uc774\uace0 \uc9c4\ub3d9\uc218\uac00 1700Hz\uc778 \uc74c\ud30c\uc758 \ud30c\uc7a5\uc740?", "opts": ["0.1 m", "0.2 m", "0.5 m", "2 m"], "ans": 2, "exp": "\u03bb = v/f = 340m/s / 1700Hz = 0.2m\uc785\ub2c8\ub2e4."}, {"num": 170, "text": "[\uc2ec\ud654] \uac19\uc740 \ub9e4\uc9c8\uc5d0\uc11c \uc9c4\ub3d9\uc218\uac00 2\ubc30 \uc99d\uac00\ud558\uba74 \ud30c\uc7a5\uc740 \uc5b4\ub5bb\uac8c \ubcc0\ud560\uae4c?", "opts": ["2\ubc30 \uc99d\uac00\ud55c\ub2e4", "1/2\ub85c \uac10\uc18c\ud55c\ub2e4", "4\ubc30 \uc99d\uac00\ud55c\ub2e4", "\ubcc0\ud558\uc9c0 \uc54a\ub294\ub2e4"], "ans": 2, "exp": "v = \u03bbf\ub294 \ub9e4\uc9c8\uc5d0\uc11c \uc77c\uc815\ud558\ubbc0\ub85c, f\uac00 2\ubc30 \uc99d\uac00\ud558\uba74 \u03bb\ub294 1/2\ub85c \uac10\uc18c\ud569\ub2c8\ub2e4."}, {"num": 171, "text": "[\uc2ec\ud654] \ud30c\uc7a5\uc774 0.2m, \uc9c4\ub3d9\uc218\uac00 1700Hz\uc778 \uc74c\ud30c\uac00 \ub2e4\ub978 \ub9e4\uc9c8\uc5d0 \uc9c4\uc785\ud558\uc5ec \uc9c4\ub3d9\uc218\uac00 \ubcc0\ud558\uc9c0 \uc54a\uace0 \uc18d\ub825\uc774 1020m/s\uac00 \ub418\uc5c8\uc744 \ub54c, \uc0c8\ub85c\uc6b4 \ub9e4\uc9c8\uc5d0\uc11c\uc758 \ud30c\uc7a5\uc740?", "opts": ["0.06 m", "0.12 m", "0.6 m", "1.2 m"], "ans": 3, "exp": "\uc0c8 \ub9e4\uc9c8\uc5d0\uc11c \u03bb' = v'/f = 1020m/s / 1700Hz = 0.6m\uc785\ub2c8\ub2e4."}, {"num": 172, "text": "\uace0\uc815\ub2e8 \ubc18\uc0ac\uc758 \ud2b9\uc9d5\uc73c\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 \uc785\uc0ac\ud30c\uc640 \uac19\ub2e4", "\ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 \uc785\uc0ac\ud30c\ubcf4\ub2e4 180\u00b0 \uc55e\uc120\ub2e4", "\ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 \uc785\uc0ac\ud30c\ubcf4\ub2e4 180\u00b0 \ub4a4\ub5a8\uc5b4\uc9c4\ub2e4", "\ubc18\uc0ac\uac00 \uc77c\uc5b4\ub098\uc9c0 \uc54a\ub294\ub2e4"], "ans": 3, "exp": "\uace0\uc815\ub2e8 \ubc18\uc0ac\uc5d0\uc11c\ub294 \ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 \uc785\uc0ac\ud30c\ubcf4\ub2e4 180\u00b0 \ub4a4\ub5a8\uc5b4\uc9d1\ub2c8\ub2e4(\uc5ed\uc704\uc0c1). \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-8 (\uac00)\ub97c \ucc38\uace0\ud558\uc138\uc694."}, {"num": 173, "text": "\uc790\uc720\ub2e8 \ubc18\uc0ac\uc758 \ud2b9\uc9d5\uc73c\ub85c \uc62c\ubc14\ub978 \uac83\uc740?", "opts": ["\ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 180\u00b0 \ubcc0\ud55c\ub2e4", "\ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 \uc785\uc0ac\ud30c\uc640 \uac19\ub2e4", "\ubc18\uc0ac\uac00 \uc77c\uc5b4\ub098\uc9c0 \uc54a\ub294\ub2e4", "\ud30c\ub3d9\uc774 \uc9c4\ud589 \ubc29\ud5a5\uc774 \ubc14\ub00c\uc9c0 \uc54a\ub294\ub2e4"], "ans": 2, "exp": "\uc790\uc720\ub2e8 \ubc18\uc0ac\uc5d0\uc11c\ub294 \ubc18\uc0ac\ud30c\uc758 \uc704\uc0c1\uc774 \uc785\uc0ac\ud30c\uc640 \uac19\uc2b5\ub2c8\ub2e4(\uac19\uc740 \uc704\uc0c1). \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-8 (\ub098)\ub97c \ucc38\uace ub2e4", "\ud608\uc561, \uadfc\uc721, \uc9c0\ubc29 \ub4f1 \uc131\ubd84\uc5d0 \ub530\ub77c \ucd08\uc74c\ud30c\uc758 \uc18d\ub3c4\uac00 \ub2e4\ub974\uae30 \ub54c\ubb38\uc5d0 \uacbd\uacc4\uba74\uc5d0\uc11c \ubc18\uc0ac\ud558\ub294 \uc815\ub3c4\uac00 \ub2e4\ub974\ub2e4", "\ucd08\uc74c\ud30c\uc758 \uc9c4\ub3d9\uc218\ub97c \uce21\uc815\ud55c\ub2e4", "\ucd08\uc74c\ud30c\uc758 \ud30c\uc7a5\uc744 \uc9c1\uc811 \uce21\uc815\ud55c\ub2e4"], "ans": 2, "exp": "\ucd08\uc74c\ud30c \uc601\uc0c1 \uc9c4\ub2e8\uc740 \uc11c\ub85c \ub2e4\ub978 \uc131\ubd84\uc758 \uacbd\uacc4\uba74\uc5d0\uc11c \ubc18\uc0ac\ub418\ub294 \ucd08\uc74c\ud30c\uc758 \uc591\uc774 \ub2e4\ub978 \uc810\uc744 \uc774\uc6a9\ud569\ub2c8\ub2e4. \uad50\uacfc\uc11c \uadf8\ub9bc \u2162-9\ub97c \ucc38\uace0\ud558\uc138\uc694."}, {"num": 177, "text": "\ube44\ud30c\uad34 \uac80\uc0ac(Non-Destructive Testing)\uc758 \ubaa9\uc801\uc73c\ub85c \uc633\uc740 \uac83\uc740?", "opts": ["\uc7ac\ub8cc\uc758 \uc678\ud615 \ubcc0\ud654 \uac10\uc9c0", "\ucd08\uc74c\ud30c\ub97c \uc774\uc6a9\ud558\uc5ec \ubb3c\uccb4\uc758 \ud45c\uba74 \uacb0\ud568\ub9cc \ucc3e\uae30", "\ubb3c\uccb4\ub97c \uc190\uc0c1\uc2dc\ud0a4\uc9c0 \uc54a\uc73c\uba74\uc11c \ub0b4\ubd80\uc758 \uacb0\ud568\uc744 \ucc3e\uae30", "\uc628\ub3c4 \ubcc0\ud654 \uce21\uc815"], "ans": 3, "exp": "\ube44\ud30c\uad34 \uac80\uc0ac\ub294 \ube44\ud589\uae30, \ub2e4\ub9ac, \uac74\ubb3c \ub4f1 \ub300\ud615 \uad6c\uc870\ubb3c\uc744 \uc190\uc0c1\uc2dc\ud0a4\uc9c0 \uc54a\uc73c\uba74\uc11c \ucd08\uc74c\ud30c\ub85c \ub0b4\ubd80 \uacb0\ud568\uc744 \ucc3e\ub294 \uac80\uc0ac \ubc29\ubc95\uc785\ub2c8\ub2e4."}]};

let currentQuestion = 0;
let userAnswers = {};
let studentName = '';
let quizMode = 'all';

function startQuiz() {
  studentName = document.getElementById('name').value || '학생';
  quizMode = document.getElementById('mode').value;
  
  if (!studentName.trim()) {
    alert('이름을 입력해주세요');
    return;
  }
  
  showScreen('screen-quiz');
  document.getElementById('headerText').textContent = `${quizData.mainName} · ${quizData.subName} · ${quizData.sectionName} · 40문항`;
  document.getElementById('qTotal').textContent = quizData.questions.length;
  
  displayQuestion(0);
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
  window.scrollTo(0, 0);
}

function displayQuestion(index) {
  const q = quizData.questions[index];
  currentQuestion = index;
  
  document.getElementById('qNum').textContent = index + 1;
  document.getElementById('questionText').textContent = q.text;
  
  // 진행률
  const progress = ((index + 1) / quizData.questions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  
  // 선택지
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  
  q.opts.forEach((opt, i) => {
    const optNum = i + 1;
    const id = 'opt-' + index + '-' + optNum;
    
    const div = document.createElement('div');
    div.className = 'option';
    if (userAnswers[index] === optNum) div.classList.add('selected');
    
    div.innerHTML = `
      <input type="radio" id="${id}" name="option" value="${optNum}" ${userAnswers[index] === optNum ? 'checked' : ''}>
      <label for="${id}">${optNum}. ${opt}</label>
    `;
    
    div.addEventListener('click', () => {
      userAnswers[index] = optNum;
      displayQuestion(index);
    });
    
    container.appendChild(div);
  });
  
  // 해설 표시
  if (userAnswers[index] !== undefined) {
    const isCorrect = userAnswers[index] === q.ans;
    document.getElementById('explanationBox').style.display = 'block';
    document.getElementById('explanationText').textContent = q.exp;
    
    if (isCorrect) {
      document.getElementById('explanationBox').style.borderLeftColor = '#2d5a3d';
    } else {
      document.getElementById('explanationBox').style.borderLeftColor = '#c0392b';
    }
  } else {
    document.getElementById('explanationBox').style.display = 'none';
  }
  
  // 버튼 활성화
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').textContent = index === quizData.questions.length - 1 ? '완료' : '다음';
}

function nextQuestion() {
  if (currentQuestion < quizData.questions.length - 1) {
    displayQuestion(currentQuestion + 1);
  } else {
    showResult();
  }
}

function prevQuestion() {
  if (currentQuestion > 0) {
    displayQuestion(currentQuestion - 1);
  }
}

function showResult() {
  const correct = Object.keys(userAnswers).filter(i => 
    userAnswers[i] === quizData.questions[i].ans
  ).length;
  
  const total = quizData.questions.length;
  const answered = Object.keys(userAnswers).length;
  const percent = Math.round((correct / total) * 100);
  
  document.getElementById('resultIcon').textContent = percent >= 80 ? '🎉' : percent >= 60 ? '👍' : '💪';
  document.getElementById('resultScore').textContent = correct + '/' + total;
  document.getElementById('resultText').textContent = percent + '% 정답';
  document.getElementById('answeredCount').textContent = answered + ' / ' + total;
  document.getElementById('correctCount').textContent = correct + '개';
  document.getElementById('correctRate').textContent = percent + '%';
  
  showScreen('screen-result');
}
</script>
