<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>열과 에너지 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 공통 ── */
.screen { display: none; }
.screen.active { display: block; }

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 14px 28px;
  font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-ghost:hover { background: var(--accent-light); opacity: 1; }

/* ── SCREEN 1: 입력 ── */
#screen-intro {
  padding-top: 80px;
}

.intro-header {
  text-align: center;
  margin-bottom: 48px;
}

.intro-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

.intro-header h1 { margin-bottom: 8px; }
.intro-header p { color: var(--text-dim); font-size: 0.9rem; }

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

.form-group input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 1rem;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(--accent); }

.form-info {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: var(--accent-light);
  border-radius: 10px;
  padding: 14px 16px;
}

.form-info span {
  font-size: 0.82rem;
  color: var(--accent);
}

/* ── SCREEN 2: 퀴즈 ── */
#screen-quiz { padding-top: 0; }

.quiz-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.quiz-topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 6px;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.quiz-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-shrink: 0;
}

.meta-item {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.meta-item span {
  color: var(--text);
  font-weight: 500;
}

.quiz-body {
  padding: 32px 20px;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.3s;
}

.q-card.correct { border-color: var(--correct); }
.q-card.wrong { border-color: var(--wrong); }

.q-head {
  padding: 20px 24px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 3px;
  flex-shrink: 0;
}

.q-text {
  font-size: 0.93rem;
  line-height: 1.75;
  white-space: pre-line;
}

.q-options {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
  transition: all 0.15s;
  width: 100%;
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
}

.opt-btn:disabled { cursor: default; }

.opt-btn.correct {
  border-color: var(--correct);
  background: var(--correct-light);
  color: var(--correct);
}

.opt-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
  color: var(--wrong);
}

.opt-btn.reveal {
  border-color: rgba(45,90,61,0.35);
  background: rgba(45,90,61,0.04);
  color: rgba(45,90,61,0.6);
}

.opt-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}

.opt-btn.correct .opt-label { background: var(--correct); border-color: var(--correct); color: #fff; }
.opt-btn.wrong .opt-label { background: var(--wrong); border-color: var(--wrong); color: #fff; }

/* submit btn area */
.submit-wrap {
  padding: 0 20px 40px;
  max-width: 720px;
  margin: 0 auto;
}

/* ── SCREEN 3: 결과 ── */
#screen-result { padding-top: 48px; }

.result-hero {
  text-align: center;
  padding: 48px 20px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}

.result-name {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}

.result-score {
  font-size: 4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 4px;
}

.result-score-sub {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
}

.stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--text);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.result-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

.result-section h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-wrong {
  background: var(--wrong-light);
  color: var(--wrong);
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 20px;
  font-family: 'DM Mono', monospace;
}

/* review card */
.review-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.review-card .q-head { padding-bottom: 12px; }

.review-exp {
  padding: 14px 24px 18px;
  border-top: 1px solid var(--border);
  background: var(--accent-light);
}

.review-exp-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--accent);
  margin-bottom: 5px;
  letter-spacing: 0.06em;
}

.review-exp p {
  font-size: 0.84rem;
  color: var(--accent);
  line-height: 1.65;
}

.review-retry-wrap {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-actions {
  max-width: 720px;
  margin: 32px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* saving overlay */
.saving-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-family: 'DM Mono', monospace;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}

.saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: 이름 / 학교 입력
══════════════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <div class="container">
    <div class="intro-header">
      <div class="tag">PHYSICS QUIZ</div>
      <h1>열과 에너지</h1>
      <p>물리학 · 1단원 힘과 에너지 · 2중단원 에너지와 열 · 2섹션</p>
    </div>

    <div class="form-card">
      <div class="form-info">
        <span>📋 총 20문항 · 객관식 4지선다 · 시간 제한 없음</span>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" id="input-name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="input-school" placeholder="○○고등학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>전화번호 뒷자리 4자리 <span style="color:var(--text-dim);font-weight:300;">(동명이인 구별용)</span></label>
        <input type="tel" id="input-phone" placeholder="1234" autocomplete="off" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
      </div>

      <button class="btn" onclick="startQuiz()">시작하기 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: 퀴즈
══════════════════════════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-topbar">
    <div class="quiz-topbar-inner">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="quiz-meta">
        <div class="meta-item" id="metaProgress">0 / 20</div>
        <div class="meta-item">⏱ <span id="timerDisplay">00:00</span></div>
      </div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody"></div>

  <div class="submit-wrap">
    <button class="btn" onclick="submitQuiz()">제출하기</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 3: 결과
══════════════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="result-hero">
    <div class="result-name" id="resultName"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score-sub" id="resultScoreSub"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-val" id="statTime"></div>
        <div class="stat-label">풀이 시간</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statCorrect"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statWrong"></div>
        <div class="stat-label">오답</div>
      </div>
    </div>
  </div>

  <div class="result-section" id="reviewSection"></div>

  <div class="result-actions">
    <button class="btn btn-ghost" onclick="resetQuiz()">↺ 새로 응시하기</button>
  </div>
</div>

<div class="saving-toast" id="savingToast"></div>

<script>
// ══════════════════════════════════════
// Airtable 설정
// ══════════════════════════════════════
const AT_TOKEN   = "patBcLElKAr7fPbgS.0f288a25e39501f27d9d33569371fc819acb54173cf44daa68fc028f16e479f9";
const AT_BASE    = "appmCOjqp5xIJuPqt";
const AT_SCORES  = "scores";

// ══════════════════════════════════════
// 퀴즈 메타
// ══════════════════════════════════════
const QUIZ_META = {
  subjectCode: "PHY",
  subjectName: "물리학",
  mainNo:      1,
  mainName:    "힘과 에너지",
  subNo:       2,
  subName:     "에너지와 열",
  sectionNo:   2,
  sectionName: "열과 에너지"
};

// ══════════════════════════════════════
// 퀴즈 데이터
// ══════════════════════════════════════
// ══════════════════════════════════════
// 1-2-2 열과 에너지 (20문항, ba 15 + ad 5)
// 정답 시퀀스: 1,2,3,4,4,1,2,3,4,1,2,3,4,4,1,2,3,3,1,2
// 정답 분포: ①5 ②5 ③5 ④5
// ══════════════════════════════════════
const QUIZ = [
  // ══════════════════════════════════════
  // 블록 A. 역학적 에너지의 전환과 열 (Q1~Q2)
  // ══════════════════════════════════════
  {num:1, text:"두 손바닥을 빠르게 비비면 손이 따뜻해진다. 그 까닭으로 옳은 것은?", opts:["손의 역학적 에너지가 마찰에 의해 열로 전환되기 때문", "손의 화학 에너지가 직접 빛으로 전환되기 때문", "손의 질량이 줄어들기 때문", "손이 주변 공기로부터 열을 흡수하기 때문"], ans:1, exp:"두 물체가 접촉한 채로 움직이면 마찰에 의해 역학적 에너지의 일부가 열로 전환되어 접촉면의 온도가 올라갑니다. 빠르게 비빌수록 더 많은 역학적 에너지가 열로 바뀌므로 온도가 더 많이 올라갑니다."},

  {num:2, text:"'열'의 정의로 옳은 것은?", opts:["물체가 가진 에너지의 총량", "온도 차에 의해 전달되는 에너지", "물체의 온도 그 자체", "물체를 이루는 입자의 개수"], ans:2, exp:"열은 온도 차에 의해 전달되는 에너지입니다. 즉 '물체가 가지고 있는 것'이 아니라 '이동하는 과정'을 가리키는 말입니다. 물체가 가지고 있는 것은 내부 에너지이며, 열은 항상 온도가 높은 쪽에서 낮은 쪽으로 이동합니다."},

  // ══════════════════════════════════════
  // 블록 B. 줄(Joule)의 실험과 열의 일당량 (Q3~Q5)
  // ══════════════════════════════════════
  {num:3, text:"줄(Joule)의 실험 장치에서 일어나는 에너지 전환 순서로 옳은 것은?", opts:["물의 열에너지 → 회전 날개의 운동 에너지 → 추의 위치 에너지", "추의 운동 에너지 → 물의 위치 에너지 → 날개의 열에너지", "추의 위치 에너지 → 회전 날개의 운동 에너지 → 물의 열에너지", "물의 위치 에너지 → 추의 운동 에너지 → 날개의 열에너지"], ans:3, exp:"추가 중력에 의해 떨어지면서 위치 에너지가 감소하고, 도르래로 연결된 회전 날개가 돌아가며 운동 에너지를 얻습니다. 날개가 물을 휘저으면 그 운동 에너지가 물의 열에너지로 전환되어 물의 온도가 올라갑니다. 줄은 이 장치로 역학적 일과 전환된 열량이 정확히 비례함을 밝혀냈습니다."},

  {num:4, text:"일의 기호, 열의 기호, 열의 일당량의 기호를 순서대로 옳게 짝지은 것은?", opts:["Q, W, J", "W, J, Q", "J, W, Q", "W, Q, J"], ans:4, exp:"일은 W(Work), 열은 Q(Quantity of heat), 열의 일당량은 J로 씁니다. 일의 단위 기호 J(줄)와 열의 일당량 기호 J가 같은 글자라서 헷갈리기 쉬우므로, 문맥으로 구분하는 연습이 필요합니다."},

  {num:5, text:"[심화] 열의 일당량 J의 값과 단위, 그리고 일 W와 열 Q 사이의 관계로 옳은 것은?", opts:["J ≈ 4.2 cal/J 이고, W = Q / J 이다.", "J ≈ 9.8 J/cal 이고, W = JQ 이다.", "J ≈ 1 J/cal 이고, W = Q 이다.", "J ≈ 4.2 J/cal 이고, W = JQ 이다."], ans:4, exp:"줄의 실험 결과 역학적 일과 발생한 열량은 정확히 비례하며, 그 비례상수가 열의 일당량입니다. W = JQ, J ≈ 4.2 J/cal. 즉 1 cal의 열은 약 4.2 J의 일에 해당합니다. 단위가 J/cal 인 이유는 cal 단위의 열량 Q에 곱해서 J 단위의 일 W가 나와야 하기 때문입니다."},

  // ══════════════════════════════════════

  // ══════════════════════════════════════

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let userName = '', userSchool = '', userPhone = '';
let userAnswers = {}; // num → chosen index (1~4)
let timerInterval = null;
let elapsedSec = 0;
let quizStarted = false;

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function toast(msg, duration = 2500) {
  const el = document.getElementById('savingToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ══════════════════════════════════════
// SCREEN 1 → 시작
// ══════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교를 입력해주세요.'); return; }
  if (!/^[0-9]{4}$/.test(phone)) { alert('전화번호 뒷자리 4자리(숫자)를 입력해주세요.'); return; }

  userName = name;
  userSchool = school;
  userPhone = phone;
  userAnswers = {};
  elapsedSec = 0;

  renderQuiz();
  showScreen('screen-quiz');
  startTimer();
}

// ══════════════════════════════════════
// 타이머
// ══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(elapsedSec);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

// ══════════════════════════════════════
// 퀴즈 렌더
// ══════════════════════════════════════
const LABELS = ['①','②','③','④'];

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = QUIZ.map(q => `
    <div class="q-card" id="qcard-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="q-options">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="opt-${q.num}-${i+1}" onclick="selectOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');
  updateProgress();
}

function selectOpt(num, chosen) {
  userAnswers[num] = chosen;

  // 선택 표시
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`opt-${num}-${i}`);
    btn.style.borderColor = i === chosen ? 'var(--accent)' : '';
    btn.style.background = i === chosen ? 'var(--accent-light)' : '';
  }
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const total = QUIZ.length;
  document.getElementById('metaProgress').textContent = `${answered} / ${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

// ══════════════════════════════════════
// 제출
// ══════════════════════════════════════
function submitQuiz() {
  const answered = Object.keys(userAnswers).length;
  if (answered < QUIZ.length) {
    if (!confirm(`아직 ${QUIZ.length - answered}문제가 남아 있어요. 제출하시겠어요?`)) return;
  }
  stopTimer();
  showResult();
}

// ══════════════════════════════════════
// 결과
// ══════════════════════════════════════
function showResult() {
  const correct = QUIZ.filter(q => userAnswers[q.num] === q.ans);
  const wrong   = QUIZ.filter(q => userAnswers[q.num] !== q.ans);
  const score   = correct.length;
  const total   = QUIZ.length;

  document.getElementById('resultName').textContent = `${userName} · ${userSchool} · ${userPhone}`;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultScoreSub').textContent = `/ ${total} 문항`;
  document.getElementById('statTime').textContent = fmtTime(elapsedSec);
  document.getElementById('statCorrect').textContent = `${score}개`;
  document.getElementById('statWrong').textContent = `${wrong.length}개`;

  // 오답 리뷰
  const reviewSection = document.getElementById('reviewSection');
  if (wrong.length === 0) {
    reviewSection.innerHTML = `<div style="text-align:center;padding:32px 0;color:var(--accent);font-weight:700;">🎉 전부 맞혔어요!</div>`;
  } else {
    reviewSection.innerHTML = `
      <h2>틀린 문제 <span class="badge-wrong">${wrong.length}문제</span></h2>
      ${wrong.map(q => renderReviewCard(q)).join('')}
    `;
  }

  showScreen('screen-result');
  saveScore(score, total);
}

function renderReviewCard(q) {
  return `
    <div class="review-card" id="review-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="review-retry-wrap" id="retry-opts-${q.num}">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="retry-opt-${q.num}-${i+1}" onclick="retryOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="review-exp">
        <div class="review-exp-label">✦ 해설</div>
        <p>${q.exp}</p>
      </div>
    </div>
  `;
}

function retryOpt(num, chosen) {
  const q = QUIZ.find(x => x.num === num);
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`retry-opt-${num}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.ans) btn.className = 'opt-btn correct';
    else if (i === chosen && chosen !== q.ans) btn.className = 'opt-btn wrong';
    else btn.className = 'opt-btn reveal';
  }
}

// ══════════════════════════════════════
// Airtable 저장
// ══════════════════════════════════════
async function saveScore(score, total) {
  toast('점수 저장 중...');
  try {
    const res = await fetch(`https://api.airtable.com/v0/${AT_BASE}/${AT_SCORES}`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${AT_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        fields: {
          '이름': userName,
          '학교': userSchool,
          'phone_last4': userPhone,
          '날짜': new Date().toISOString().split('T')[0],
          '과목코드': QUIZ_META.subjectCode,
          '과목명': QUIZ_META.subjectName,
          '대단원번호': QUIZ_META.mainNo,
          '대단원명': QUIZ_META.mainName,
          '중단원번호': QUIZ_META.subNo,
          '중단원명': QUIZ_META.subName,
          '섹션번호': QUIZ_META.sectionNo,
          '섹션명': QUIZ_META.sectionName,
          '총점': score,
          '총문항수': total,
          '풀이시간': fmtTime(elapsedSec)
        }
      })
    });
    if (res.ok) toast('✓ 점수가 저장되었습니다.');
    else toast('저장 실패 — 네트워크를 확인해주세요.');
  } catch(e) {
    toast('저장 실패 — 네트워크를 확인해주세요.');
  }
}

// ══════════════════════════════════════
// 리셋
// ══════════════════════════════════════
function resetQuiz() {
  userName = '';
  userSchool = '';
  userPhone = '';
  userAnswers = {};
  elapsedSec = 0;
  document.getElementById('input-name').value = '';
  document.getElementById('input-school').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('timerDisplay').textContent = '00:00';
  showScreen('screen-intro');
}
</script>
</body>
</html>
