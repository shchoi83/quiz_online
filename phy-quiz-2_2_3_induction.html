<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전자기 유도 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 공통 ── */
.screen { display: none; }
.screen.active { display: block; }

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 14px 28px;
  font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-ghost:hover { background: var(--accent-light); opacity: 1; }

/* ── SCREEN 1: 입력 ── */
#screen-intro {
  padding-top: 80px;
}

.intro-header {
  text-align: center;
  margin-bottom: 48px;
}

.intro-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

.intro-header h1 { margin-bottom: 8px; }
.intro-header p { color: var(--text-dim); font-size: 0.9rem; }

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

.form-group input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 1rem;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(--accent); }

.form-info {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: var(--accent-light);
  border-radius: 10px;
  padding: 14px 16px;
}

.form-info span {
  font-size: 0.82rem;
  color: var(--accent);
}

/* ── SCREEN 2: 퀴즈 ── */
#screen-quiz { padding-top: 0; }

.quiz-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.quiz-topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 6px;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.quiz-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-shrink: 0;
}

.meta-item {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.meta-item span {
  color: var(--text);
  font-weight: 500;
}

.quiz-body {
  padding: 32px 20px;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.3s;
}

.q-card.correct { border-color: var(--correct); }
.q-card.wrong { border-color: var(--wrong); }

.q-head {
  padding: 20px 24px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 3px;
  flex-shrink: 0;
}

.q-text {
  font-size: 0.93rem;
  line-height: 1.75;
  white-space: pre-line;
}

.q-options {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
  transition: all 0.15s;
  width: 100%;
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
}

.opt-btn:disabled { cursor: default; }

.opt-btn.correct {
  border-color: var(--correct);
  background: var(--correct-light);
  color: var(--correct);
}

.opt-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
  color: var(--wrong);
}

.opt-btn.reveal {
  border-color: rgba(45,90,61,0.35);
  background: rgba(45,90,61,0.04);
  color: rgba(45,90,61,0.6);
}

.opt-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}

.opt-btn.correct .opt-label { background: var(--correct); border-color: var(--correct); color: #fff; }
.opt-btn.wrong .opt-label { background: var(--wrong); border-color: var(--wrong); color: #fff; }

/* submit btn area */
.submit-wrap {
  padding: 0 20px 40px;
  max-width: 720px;
  margin: 0 auto;
}

/* ── SCREEN 3: 결과 ── */
#screen-result { padding-top: 48px; }

.result-hero {
  text-align: center;
  padding: 48px 20px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}

.result-name {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}

.result-score {
  font-size: 4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 4px;
}

.result-score-sub {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
}

.stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--text);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.result-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

.result-section h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-wrong {
  background: var(--wrong-light);
  color: var(--wrong);
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 20px;
  font-family: 'DM Mono', monospace;
}

/* review card */
.review-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.review-card .q-head { padding-bottom: 12px; }

.review-exp {
  padding: 14px 24px 18px;
  border-top: 1px solid var(--border);
  background: var(--accent-light);
}

.review-exp-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--accent);
  margin-bottom: 5px;
  letter-spacing: 0.06em;
}

.review-exp p {
  font-size: 0.84rem;
  color: var(--accent);
  line-height: 1.65;
}

.review-retry-wrap {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-actions {
  max-width: 720px;
  margin: 32px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* saving overlay */
.saving-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-family: 'DM Mono', monospace;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}

.saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: 이름 / 학교 입력
══════════════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <div class="container">
    <div class="intro-header">
      <div class="tag">PHYSICS QUIZ</div>
      <h1>전자기 유도</h1>
      <p>물리학 · 2단원 전기와 자기 · 2중단원 자기 · 3섹션</p>
    </div>

    <div class="form-card">
      <div class="form-info">
        <span>📋 총 30문항 · 객관식 4지선다 · 시간 제한 없음</span>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" id="input-name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="input-school" placeholder="○○고등학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>전화번호 뒷자리 4자리 <span style="color:var(--text-dim);font-weight:300;">(동명이인 구별용)</span></label>
        <input type="tel" id="input-phone" placeholder="1234" autocomplete="off" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
      </div>

      <button class="btn" onclick="startQuiz()">시작하기 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: 퀴즈
══════════════════════════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-topbar">
    <div class="quiz-topbar-inner">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="quiz-meta">
        <div class="meta-item" id="metaProgress">0 / 30</div>
        <div class="meta-item">⏱ <span id="timerDisplay">00:00</span></div>
      </div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody"></div>

  <div class="submit-wrap">
    <button class="btn" onclick="submitQuiz()">제출하기</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 3: 결과
══════════════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="result-hero">
    <div class="result-name" id="resultName"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score-sub" id="resultScoreSub"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-val" id="statTime"></div>
        <div class="stat-label">풀이 시간</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statCorrect"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statWrong"></div>
        <div class="stat-label">오답</div>
      </div>
    </div>
  </div>

  <div class="result-section" id="reviewSection"></div>

  <div class="result-actions">
    <button class="btn btn-ghost" onclick="resetQuiz()">↺ 새로 응시하기</button>
  </div>
</div>

<div class="saving-toast" id="savingToast"></div>

<script>
// ══════════════════════════════════════
// Airtable 설정
// ══════════════════════════════════════
const AT_TOKEN   = "patBcLElKAr7fPbgS.0f288a25e39501f27d9d33569371fc819acb54173cf44daa68fc028f16e479f9";
const AT_BASE    = "appmCOjqp5xIJuPqt";

// ── Google Sheets 웹앱 (주 저장소) ──

const DUAL_WRITE  = true;   // 전환 완료 후 false 로 바꾸면 Airtable 전송 중단

// ══════════════════════════════════════
// 퀴즈 메타
// ══════════════════════════════════════
const QUIZ_META = {
  subjectCode: "PHY",
  subjectName: "물리학",
  mainNo:      2,
  mainName:    "전기와 자기",
  subNo:       2,
  subName:     "자기",
  sectionNo:   3,

};

// ══════════════════════════════════════
// 퀴즈 데이터
// ══════════════════════════════════════
const QUIZ = [
  // ── 전자기 유도 정의·발견 (1~3) ──
  {num:1, text:"전자기 유도 현상을 발견한 과학자로 옳은 것은?", opts:["옴", "외르스테드", "패러데이", "쿨롱"], ans:3, exp:"전자기 유도 현상은 1831년경 영국의 물리학자 패러데이(Faraday)가 발견했습니다. 코일과 자석을 이용한 실험을 통해 자기장의 변화에 의해 전류가 유도됨을 밝혀냈습니다."},
  {num:2, text:"전자기 유도의 정의로 가장 옳은 것은?", opts:["전류가 흐르는 도선 주위에 자기장이 생기는 현상", "코일을 통과하는 자기 선속이 시간에 따라 변할 때 코일에 유도 전류가 흐르는 현상", "자석의 N극과 S극이 서로 끌어당기는 현상", "전기가 흐르는 도선이 외부 자기장 속에서 힘을 받는 현상"], ans:2, exp:"전자기 유도란 코일을 통과하는 자기 선속이 시간에 따라 변할 때, 코일에 유도 전류가 흐르고 그 전류를 흐르게 하는 전압(유도 기전력)이 생기는 현상입니다."},
  {num:3, text:"자가발전 손전등(흔들면 불이 켜지는 손전등)의 작동 원리로 옳은 것은?", opts:["손전등 내부의 건전지가 진동으로 충전된다.", "손전등을 흔들면 내부의 자석이 코일 속을 왕복 운동하여, 코일을 통과하는 자기 선속이 변하고 유도 전류가 흐른다.", "흔드는 마찰열로 LED가 점등된다.", "손전등을 흔들면 빛이 직접 발생한다."], ans:2, exp:"자가발전 손전등은 흔들면 내부의 자석이 코일 속을 왕복 운동하여, 코일을 통과하는 자기 선속이 시간에 따라 변합니다. 이로 인해 코일에 유도 전류가 흐르고 LED에 불이 켜집니다."},

  // ── 자속 (수업 핵심 Q2) (4~6) ──
  {num:4, text:"자기 선속(자속)에 대한 정의로 가장 옳은 것은?", opts:["전기장의 변화에 의해 만들어지는 양", "어떤 단면을 통과하는 자기장의 양", "전류의 변화량을 나타내는 양", "전위차의 크기"], ans:2, exp:"자기 선속(자속, Φ)은 어떤 단면을 통과하는 자기장의 양을 나타내는 물리량입니다."},
  {num:5, text:"자기 선속 Φ, 자기장의 세기 B, 단면의 넓이 A 사이의 관계로 옳은 것은? (단, 자기장이 단면에 수직)", opts:["Φ = B / A", "Φ = B + A", "Φ = B × A", "Φ = A / B"], ans:3, exp:"자기장이 단면에 수직일 때 자기 선속은 자기장 세기와 단면적의 곱으로 정의됩니다. Φ = BA. 자기장이 셀수록(B 클수록), 단면이 넓을수록(A 클수록) 자기 선속이 커집니다."},
  {num:6, text:"자기 선속 Φ에 대한 설명으로 옳지 않은 것은?", opts:["자기장의 세기가 클수록 자속이 커진다.", "단면의 넓이가 클수록 자속이 커진다.", "자속의 시간적 변화는 유도 기전력과 관련이 있다.", "자속은 전류의 세기에 의해서만 결정된다."], ans:4, exp:"자기 선속은 자기장의 세기 B와 단면적 A에 의해 결정됩니다(Φ=BA). 전류는 자기장을 만드는 원인일 수 있지만, 자속 자체의 정의에 직접 들어가는 양이 아닙니다."},

  // ── 패러데이 법칙 (수업 핵심 Q3) (7~10) ──
  {num:7, text:"패러데이 법칙에 따라 유도 기전력의 크기를 결정하는 두 요소로 옳은 것은?", opts:["코일의 색깔과 두께", "코일의 감은 수와, 단위시간 동안 코일을 통과하는 자기 선속의 변화", "코일의 길이와 무게", "전원의 종류와 도선의 재질"], ans:2, exp:"패러데이 법칙: 유도 기전력의 크기는 (1) 코일의 감은 수(N)가 많을수록 커지고, (2) 단위시간 동안 코일을 통과하는 자기 선속의 변화(ΔΦ/Δt)가 클수록 커집니다."},
  {num:8, text:"패러데이 법칙을 식으로 옳게 나타낸 것은? (V: 유도 기전력, N: 감은 수, ΔΦ/Δt: 단위시간당 자속 변화량, 부호 무시)", opts:["V = N × (ΔΦ/Δt)", "V = (ΔΦ/Δt) / N", "V = N + (ΔΦ/Δt)", "V = N / (ΔΦ × Δt)"], ans:1, exp:"패러데이 법칙은 V = N × (ΔΦ/Δt) 입니다. (정확한 부호를 포함한 식은 V = -N(ΔΦ/Δt)이며, 음(-)부호는 렌츠 법칙에 의한 유도 기전력의 방향을 나타냅니다.)"},
  {num:9, text:"패러데이 법칙에서 유도 기전력의 크기를 더 크게 하기 위한 방법으로 옳지 않은 것은?", opts:["코일의 감은 수를 늘린다.", "자석을 더 빠르게 움직여 단위시간 자속 변화를 크게 한다.", "더 강한 자석을 사용하여 자속의 변화를 크게 한다.", "코일과 자석을 정지시킨다."], ans:4, exp:"코일과 자석이 정지해 있으면 자속 변화가 0이 되어 유도 기전력은 0입니다. 따라서 정지시키는 것은 유도 기전력을 크게 하는 방법이 아닙니다. 감은 수, 자석 속도, 자석 세기를 늘리면 유도 기전력이 커집니다."},
  {num:10, text:"코일 근처에 자석이 정지해 있을 때, 코일에 흐르는 유도 전류는?", opts:["0이다. (전류가 흐르지 않는다)", "일정한 큰 값으로 흐른다.", "자석의 세기에 비례한다.", "자석의 종류에 따라 결정된다."], ans:1, exp:"전자기 유도는 자기 선속이 '시간에 따라 변할 때' 일어나는 현상입니다. 자석이 정지해 있으면 자속 변화가 없으므로 유도 기전력도 유도 전류도 0입니다."},

  // ── 렌츠 법칙 (수업 핵심 Q1) (11~17) ──
  {num:11, text:"렌츠 법칙의 핵심 내용으로 옳은 것은?", opts:["유도 전류는 자기 선속의 변화를 도와주는 방향으로 흐른다.", "유도 전류는 항상 자석 쪽으로 흐른다.", "유도 전류는 자기 선속의 변화를 방해하는 방향으로 흐른다.", "유도 전류는 항상 자석에서 멀어지는 쪽으로 흐른다."], ans:3, exp:"렌츠 법칙: 유도 전류는 코일을 통과하는 자기 선속의 변화를 '방해하는' 방향으로 흐릅니다. 즉, 자속이 증가하면 그 증가를 방해하고, 감소하면 감소를 방해하는 방향으로 자기장이 만들어지도록 유도 전류가 흐릅니다."},
  {num:12, text:"자석의 N극을 코일에 가까이 가져갈 때, 코일에 유도되는 전류가 만드는 자기장의 방향과 그 결과로 코일이 자석에 보이는 효과로 옳은 것은?", opts:["자석을 끌어당기는 자기장이 만들어진다.", "자석과 직각 방향의 자기장이 만들어진다.", "자기장이 만들어지지 않는다.", "다가오는 자석을 밀어내는 방향의 자기장이 만들어진다."], ans:4, exp:"N극이 다가오면 코일을 통과하는 자속이 증가하므로, 렌츠 법칙에 의해 유도 전류는 그 증가를 방해하는 방향(다가오는 자석을 밀어내는 방향)으로 자기장을 만들도록 흐릅니다."},
  {num:13, text:"자석의 N극을 코일에서 멀리 떼어낼 때, 코일에 유도되는 전류가 만드는 자기장의 방향과 그 결과로 코일이 자석에 보이는 효과로 옳은 것은?", opts:["자석을 멀리 밀어내는 방향의 자기장이 만들어진다.", "멀어지는 자석을 끌어당기는 방향의 자기장이 만들어진다.", "자기장이 사라진다.", "자기장과 자석은 서로 무관하다."], ans:2, exp:"N극이 멀어지면 코일을 통과하는 자속이 감소하므로, 렌츠 법칙에 의해 유도 전류는 그 감소를 방해하는 방향(멀어지는 자석을 다시 끌어당기는 방향)으로 자기장을 만들도록 흐릅니다."},
  {num:14, text:"자석의 N극을 코일에 가까이 했을 때, 코일에 유도되는 자기장의 방향과 자속 변화의 관계로 옳은 것은?", opts:["코일 아래쪽으로 통과하는 자속이 증가하므로, 유도 자기장은 위 방향(증가를 방해)으로 형성된다.", "코일 아래쪽으로 통과하는 자속이 감소하므로, 유도 자기장은 위 방향으로 형성된다.", "자속 변화가 없으므로 유도 자기장이 만들어지지 않는다.", "유도 자기장은 항상 외부 자기장과 같은 방향으로 만들어진다."], ans:1, exp:"자석의 N극이 다가오면 코일 아래쪽 방향으로 통과하는 자기 선속이 증가합니다. 렌츠 법칙에 의해 유도 전류는 이 증가를 방해하는 방향, 즉 위 방향의 자기장을 만들도록 흐릅니다."},
  {num:15, text:"코일에 자석의 N극을 가까이 했을 때 유도 전류가 B → G(검류계) → A 방향으로 흘렀다. 이때 자석의 N극을 코일에서 멀리 하면 유도 전류의 방향은?", opts:["B → G → A (변화 없음)", "A → G → B (반대 방향)", "유도 전류는 흐르지 않는다.", "전류 방향이 90° 회전한다."], ans:2, exp:"가까이 할 때(자속 증가)와 멀리 할 때(자속 감소)는 자속 변화의 방향이 반대이므로, 렌츠 법칙에 의해 유도 전류 방향도 반대가 됩니다. 가까이 할 때 B→G→A 방향이었다면 멀리 할 때는 A→G→B 방향입니다."},
  {num:16, text:"자석의 N극 대신 S극을 코일에 가까이 가져가면, 같은 상황에서 N극을 가까이 할 때와 비교한 유도 전류의 방향은?", opts:["반대 방향이다.", "같은 방향이다.", "수직 방향이다.", "전류가 흐르지 않는다."], ans:1, exp:"S극이 다가올 때는 N극과 반대 방향의 자기장이 코일을 통과하므로, 자속 변화 방향이 반대입니다. 따라서 렌츠 법칙에 따라 유도 전류 방향도 N극을 가까이 할 때와 반대가 됩니다."},
  {num:17, text:"렌츠 법칙은 어떤 보존 법칙의 결과로 해석할 수 있는가?", opts:["전하량 보존", "에너지 보존", "운동량 보존", "각운동량 보존"], ans:2, exp:"렌츠 법칙은 에너지 보존 법칙의 결과로 해석됩니다. 만약 유도 전류가 자속 변화를 '돕는' 방향으로 흐른다면 외부의 일 없이도 점점 더 큰 전류가 흘러 에너지가 무한히 생성되어 보존 법칙에 어긋납니다. 따라서 자석의 움직임을 항상 방해하는 방향으로 흘러야 합니다."},

  // ── 에너지 전환 (18~19) ──
  {num:18, text:"자석을 코일에 가까이/멀리 움직이며 유도 전류를 만드는 과정에서 일어나는 에너지 전환으로 옳은 것은?", opts:["전기 에너지 → 역학적 에너지", "역학적 에너지 → 빛 에너지", "역학적 에너지 → 전기 에너지", "열 에너지 → 화학 에너지"], ans:3, exp:"자석을 움직일 때 코일에 유도되는 자기장은 항상 자석의 움직임을 방해하므로, 자석을 계속 움직이려면 외부에서 일을 해 주어야 합니다. 이때 줄어든 자석의 역학적 에너지가 코일의 전기 에너지로 전환됩니다."},
  {num:19, text:"자가발전 손전등에서 일어나는 에너지 전환 과정으로 옳은 것은?", opts:["전기 에너지 → 빛 에너지 → 운동 에너지", "빛 에너지 → 전기 에너지 → 운동 에너지", "운동 에너지(흔듦) → 전기 에너지(유도 전류) → 빛 에너지(LED)", "열 에너지 → 운동 에너지 → 전기 에너지"], ans:3, exp:"자가발전 손전등에서는 손으로 흔드는 운동 에너지가 자석의 왕복 운동을 통해 코일에 유도 전류를 만들고(전기 에너지로 전환), 이 전기 에너지로 LED를 켜서 빛 에너지로 전환됩니다."},

  // ── 발전기 (수업 핵심 Q4) (20~22) ──
  {num:20, text:"발전기의 작동 원리로 가장 옳은 것은?", opts:["축전기를 충·방전시켜 직류를 만든다.", "전자기 유도 현상을 이용하여 운동 에너지를 전기 에너지로 전환한다.", "전기 에너지를 운동 에너지로 전환한다.", "빛 에너지를 직접 전기 에너지로 바꾼다."], ans:2, exp:"발전기는 전자기 유도 현상을 이용하여 운동 에너지를 전기 에너지로 전환하는 장치입니다. (전동기와 정확히 반대 방향의 변환)"},
  {num:21, text:"발전기에서 도선 고리(코일)가 자석 사이에서 회전할 때 유도 전류가 흐르는 까닭으로 옳은 것은?", opts:["고리가 가열되기 때문", "정류자가 전류를 만들어내기 때문", "고리가 자석을 끌어당기기 때문", "고리를 통과하는 자기 선속이 시간에 따라 변하기 때문"], ans:4, exp:"발전기에서 도선 고리가 자석 사이에서 회전하면, 고리의 면이 자기장에 대해 기울어지는 각도가 계속 변하므로 고리를 통과하는 자기 선속이 시간에 따라 변합니다. 이 변화로 인해 패러데이 법칙에 의해 유도 기전력이 발생하고 유도 전류가 흐릅니다."},
  {num:22, text:"전동기와 발전기의 에너지 전환 방향을 비교한 설명으로 옳은 것은?", opts:["전동기와 발전기 모두 전기 → 운동 에너지", "전동기와 발전기 모두 운동 → 전기 에너지", "전동기는 전기 → 운동, 발전기는 운동 → 전기", "전동기는 운동 → 전기, 발전기는 전기 → 운동"], ans:3, exp:"전동기는 전기 에너지를 운동 에너지로 전환하는 장치이고, 발전기는 그 반대로 운동 에너지를 전기 에너지로 전환하는 장치입니다. 두 장치는 같은 구조(코일+자석)를 가지지만 에너지 흐름이 반대입니다."},

  // ── 무선 충전 (23~25) ──
  {num:23, text:"스마트폰의 무선 충전(자기 유도 방식)이 가능한 까닭으로 옳은 것은?", opts:["송신 코일에 시간에 따라 변하는 전류가 흘러 변하는 자속을 만들고, 수신 코일에 유도 전류가 흘러 배터리를 충전한다.", "충전기에서 빛이 나와 폰 내부 태양전지를 충전한다.", "충전기와 폰이 자석으로 직접 연결된다.", "음파를 이용해 에너지가 전달된다."], ans:1, exp:"무선 충전기의 송신 코일에 시간에 따라 변하는 전류가 흐르면 주변에 변하는 자기장이 생기고, 스마트폰 내부 수신 코일을 통과하는 자기 선속이 변하면서 전자기 유도 현상에 의해 수신 코일에 유도 전류가 흘러 배터리를 충전합니다."},
  {num:24, text:"자기 유도 방식 무선 충전의 한계로 옳은 것은?", opts:["송신 코일과 수신 코일의 거리가 가까울 때만 전력 송신이 가능하다.", "거리에 무관하게 항상 같은 효율로 충전된다.", "건물 전체의 모든 기기를 동시에 충전할 수 있다.", "유선 충전보다 항상 더 빠르다."], ans:1, exp:"자기 유도 방식 기술은 송신 코일과 수신 코일이 만드는 자속의 결합(coupling)에 의존하므로 거리가 멀어지면 효율이 급격히 떨어집니다. 따라서 두 코일이 가까울 때만 전력 송신이 가능합니다."},
  {num:25, text:"자기 공명 방식 무선 충전이 자기 유도 방식과 비교해 갖는 장점으로 옳은 것은?", opts:["송신 코일과 수신 코일 사이의 공명 현상을 이용해 더 먼 거리까지 전력 송신이 가능하다.", "전기 사용량이 줄어든다.", "충전기가 작아진다.", "코일이 필요 없다."], ans:1, exp:"자기 공명 방식은 송신·수신 코일의 고유 진동수를 일치시켜 공명 현상을 통해 에너지를 효율적으로 전달합니다. 이로 인해 자기 유도 방식보다 먼 거리까지 전력 송신이 가능하여 집안의 여러 전자 기기를 동시에 충전할 수도 있습니다."},

  // ── 센서 (26~28) ──
  {num:26, text:"공항 등에서 사용하는 금속 탐지기의 작동 원리로 옳은 것은?", opts:["빛이 금속에 반사되는 것을 감지한다.", "금속의 무게로 압력을 측정한다.", "송신 코일이 만드는 자기장이 금속에 유도 전류를 만들고, 그 유도 전류의 자기장이 다시 수신 코일에 유도 전류를 만들어 금속의 존재를 감지한다.", "금속의 색을 감지한다."], ans:3, exp:"금속 탐지기는 송신 코일이 만드는 자기장에 의해 금속에 유도 전류가 흐르고, 이 유도 전류가 다시 자기장을 만들어 수신 코일에 또 다른 유도 전류를 흐르게 합니다. 이 신호로 금속의 존재를 감지합니다."},
  {num:27, text:"도로의 자동차 차단기 앞에 매설된 코일의 역할로 옳은 것은?", opts:["자동차의 무게를 측정한다.", "도로의 마찰력을 줄인다.", "차량 번호를 인식한다.", "자동차가 코일 위를 지날 때 코일에 흐르는 전류의 변화를 감지하여 차단기를 작동시킨다."], ans:4, exp:"자동차 차단기 앞에는 전류가 흐르는 코일이 매설되어 있는데, 자동차(금속체)가 코일 위를 지나면 코일을 통과하는 자기 선속이 변해 코일에 흐르는 전류가 변합니다. 이 전류 변화를 감지해 차단기를 열고 닫습니다."},

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let userName = '', userSchool = '', userPhone = '';
let userAnswers = {}; // num → chosen index (1~4)
let timerInterval = null;
let elapsedSec = 0;
let quizStarted = false;

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function toast(msg, duration = 2500) {
  const el = document.getElementById('savingToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ══════════════════════════════════════
// SCREEN 1 → 시작
// ══════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교를 입력해주세요.'); return; }
  if (!/^[0-9]{4}$/.test(phone)) { alert('전화번호 뒷자리 4자리(숫자)를 입력해주세요.'); return; }

  userName = name;
  userSchool = school;
  userPhone = phone;
  userAnswers = {};
  elapsedSec = 0;

  renderQuiz();
  showScreen('screen-quiz');
  startTimer();
}

// ══════════════════════════════════════
// 타이머
// ══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(elapsedSec);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

// ══════════════════════════════════════
// 퀴즈 렌더
// ══════════════════════════════════════
const LABELS = ['①','②','③','④'];

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = QUIZ.map(q => `
    <div class="q-card" id="qcard-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="q-options">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="opt-${q.num}-${i+1}" onclick="selectOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');
  updateProgress();
}

function selectOpt(num, chosen) {
  userAnswers[num] = chosen;

  // 선택 표시
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`opt-${num}-${i}`);
    btn.style.borderColor = i === chosen ? 'var(--accent)' : '';
    btn.style.background = i === chosen ? 'var(--accent-light)' : '';
  }
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const total = QUIZ.length;
  document.getElementById('metaProgress').textContent = `${answered} / ${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

// ══════════════════════════════════════
// 제출
// ══════════════════════════════════════
function submitQuiz() {
  const answered = Object.keys(userAnswers).length;
  if (answered < QUIZ.length) {
    if (!confirm(`아직 ${QUIZ.length - answered}문제가 남아 있어요. 제출하시겠어요?`)) return;
  }
  stopTimer();
  showResult();
}

// ══════════════════════════════════════
// 결과
// ══════════════════════════════════════
function showResult() {
  const correct = QUIZ.filter(q => userAnswers[q.num] === q.ans);
  const wrong   = QUIZ.filter(q => userAnswers[q.num] !== q.ans);
  const score   = correct.length;
  const total   = QUIZ.length;

  document.getElementById('resultName').textContent = `${userName} · ${userSchool} · ${userPhone}`;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultScoreSub').textContent = `/ ${total} 문항`;
  document.getElementById('statTime').textContent = fmtTime(elapsedSec);
  document.getElementById('statCorrect').textContent = `${score}개`;
  document.getElementById('statWrong').textContent = `${wrong.length}개`;

  // 오답 리뷰
  const reviewSection = document.getElementById('reviewSection');
  if (wrong.length === 0) {
    reviewSection.innerHTML = `<div style="text-align:center;padding:32px 0;color:var(--accent);font-weight:700;">🎉 전부 맞혔어요!</div>`;
  } else {
    reviewSection.innerHTML = `
      <h2>틀린 문제 <span class="badge-wrong">${wrong.length}문제</span></h2>
      ${wrong.map(q => renderReviewCard(q)).join('')}
    `;
  }

  showScreen('screen-result');
  saveScore(score, total);
}

function renderReviewCard(q) {
  return `
    <div class="review-card" id="review-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="review-retry-wrap" id="retry-opts-${q.num}">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="retry-opt-${q.num}-${i+1}" onclick="retryOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="review-exp">
        <div class="review-exp-label">✦ 해설</div>
        <p>${q.exp}</p>
      </div>
    </div>
  `;
}

function retryOpt(num, chosen) {
  const q = QUIZ.find(x => x.num === num);
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`retry-opt-${num}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.ans) btn.className = 'opt-btn correct';
    else if (i === chosen && chosen !== q.ans) btn.className = 'opt-btn wrong';
    else btn.className = 'opt-btn reveal';
  }
}

// ══════════════════════════════════════
// 점수 저장 (Google Sheets 주 저장소 + Airtable 병행)
// ══════════════════════════════════════
function buildPayload(score, total) {
  return {
    '이름': userName,
    '학교': userSchool,
    'phone_last4': userPhone,
    '날짜': new Date().toISOString().split('T')[0],
    '과목코드': QUIZ_META.subjectCode,
    '과목명': QUIZ_META.subjectName,
    '대단원번호': QUIZ_META.mainNo,
    '대단원명': QUIZ_META.mainName,
    '중단원번호': QUIZ_META.subNo,
    '중단원명': QUIZ_META.subName,
    '섹션번호': QUIZ_META.sectionNo,
    '섹션명': QUIZ_META.sectionName,
    '총점': score,
    '총문항수': total,
    '풀이시간': fmtTime(elapsedSec)
  };
}

async function saveToSheets(payload) {
  // Content-Type을 text/plain 으로 보내야 preflight(OPTIONS)가 생기지 않음.
  // Apps Script 웹앱은 OPTIONS를 처리하지 못하므로 이 설정이 필수.
  const res = await fetch(GS_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.ok !== true) throw new Error(data.error || 'sheets rejected');
  return data;
}

async function saveToAirtable(payload) {
  const res = await fetch(`https://api.airtable.com/v0/${AT_BASE}/${AT_SCORES}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${AT_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ fields: payload })
  });
  if (!res.ok) throw new Error('airtable ' + res.status);
  return true;
}

async function saveScore(score, total) {
  toast('점수 저장 중...');
  const payload = buildPayload(score, total);

  const jobs = [saveToSheets(payload)];
  if (DUAL_WRITE) jobs.push(saveToAirtable(payload));

  const results = await Promise.allSettled(jobs);
  const sheetsOk   = results[0].status === 'fulfilled';
  const airtableOk = DUAL_WRITE ? results[1].status === 'fulfilled' : false;

  if (!sheetsOk) console.warn('[Sheets 저장 실패]', results[0].reason);
  if (DUAL_WRITE && !airtableOk) console.warn('[Airtable 저장 실패]', results[1].reason);

  if (sheetsOk || airtableOk) {
    toast('✓ 점수가 저장되었습니다.');
  } else {
    toast('저장 실패 — 네트워크를 확인해주세요.');
  }
}

// ══════════════════════════════════════
// 리셋
// ══════════════════════════════════════
function resetQuiz() {
  userName = '';
  userSchool = '';
  userPhone = '';
  userAnswers = {};
  elapsedSec = 0;
  document.getElementById('input-name').value = '';
  document.getElementById('input-school').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('timerDisplay').textContent = '00:00';
  showScreen('screen-intro');
}
</script>
