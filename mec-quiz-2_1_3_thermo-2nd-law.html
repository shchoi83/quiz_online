<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>열역학 2법칙 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 공통 ── */
.screen { display: none; }
.screen.active { display: block; }

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 14px 28px;
  font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-ghost:hover { background: var(--accent-light); opacity: 1; }

/* ── SCREEN 1: 입력 ── */
#screen-intro {
  padding-top: 80px;
}

.intro-header {
  text-align: center;
  margin-bottom: 48px;
}

.intro-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

.intro-header h1 { margin-bottom: 8px; }
.intro-header p { color: var(--text-dim); font-size: 0.9rem; }

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

.form-group input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 1rem;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(--accent); }

.form-info {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: var(--accent-light);
  border-radius: 10px;
  padding: 14px 16px;
}

.form-info span {
  font-size: 0.82rem;
  color: var(--accent);
}

/* ── SCREEN 2: 퀴즈 ── */
#screen-quiz { padding-top: 0; }

.quiz-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.quiz-topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 6px;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.quiz-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-shrink: 0;
}

.meta-item {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.meta-item span {
  color: var(--text);
  font-weight: 500;
}

.quiz-body {
  padding: 32px 20px;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.3s;
}

.q-card.correct { border-color: var(--correct); }
.q-card.wrong { border-color: var(--wrong); }

.q-head {
  padding: 20px 24px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 3px;
  flex-shrink: 0;
}

.q-text {
  font-size: 0.93rem;
  line-height: 1.75;
  white-space: pre-line;
}

.q-options {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
  transition: all 0.15s;
  width: 100%;
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
}

.opt-btn:disabled { cursor: default; }

.opt-btn.correct {
  border-color: var(--correct);
  background: var(--correct-light);
  color: var(--correct);
}

.opt-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
  color: var(--wrong);
}

.opt-btn.reveal {
  border-color: rgba(45,90,61,0.35);
  background: rgba(45,90,61,0.04);
  color: rgba(45,90,61,0.6);
}

.opt-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}

.opt-btn.correct .opt-label { background: var(--correct); border-color: var(--correct); color: #fff; }
.opt-btn.wrong .opt-label { background: var(--wrong); border-color: var(--wrong); color: #fff; }

/* submit btn area */
.submit-wrap {
  padding: 0 20px 40px;
  max-width: 720px;
  margin: 0 auto;
}

/* ── SCREEN 3: 결과 ── */
#screen-result { padding-top: 48px; }

.result-hero {
  text-align: center;
  padding: 48px 20px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}

.result-name {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}

.result-score {
  font-size: 4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 4px;
}

.result-score-sub {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
}

.stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--text);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.result-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

.result-section h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-wrong {
  background: var(--wrong-light);
  color: var(--wrong);
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 20px;
  font-family: 'DM Mono', monospace;
}

/* review card */
.review-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.review-card .q-head { padding-bottom: 12px; }

.review-exp {
  padding: 14px 24px 18px;
  border-top: 1px solid var(--border);
  background: var(--accent-light);
}

.review-exp-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--accent);
  margin-bottom: 5px;
  letter-spacing: 0.06em;
}

.review-exp p {
  font-size: 0.84rem;
  color: var(--accent);
  line-height: 1.65;
}

.review-retry-wrap {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-actions {
  max-width: 720px;
  margin: 32px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* saving overlay */
.saving-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-family: 'DM Mono', monospace;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}

.saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: 이름 / 학교 입력
══════════════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <div class="container">
    <div class="intro-header">
      <div class="tag">PHYSICS QUIZ</div>
      <h1>열역학2법칙</h1>
      <p>역학과 에너지 · 2단원 열과에너지 · 1중단원 열과 일 · 3섹션</p>
    </div>

    <div class="form-card">
      <div class="form-info">
        <span>📋 총 33문항 · 객관식 4지선다 · 시간 제한 없음</span>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" id="input-name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="input-school" placeholder="○○고등학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>전화번호 뒷자리 4자리 <span style="color:var(--text-dim);font-weight:300;">(동명이인 구별용)</span></label>
        <input type="tel" id="input-phone" placeholder="1234" autocomplete="off" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
      </div>

      <button class="btn" onclick="startQuiz()">시작하기 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: 퀴즈
══════════════════════════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-topbar">
    <div class="quiz-topbar-inner">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="quiz-meta">
        <div class="meta-item" id="metaProgress">0 / 33</div>
        <div class="meta-item">⏱ <span id="timerDisplay">00:00</span></div>
      </div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody"></div>

  <div class="submit-wrap">
    <button class="btn" onclick="submitQuiz()">제출하기</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 3: 결과
══════════════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="result-hero">
    <div class="result-name" id="resultName"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score-sub" id="resultScoreSub"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-val" id="statTime"></div>
        <div class="stat-label">풀이 시간</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statCorrect"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statWrong"></div>
        <div class="stat-label">오답</div>
      </div>
    </div>
  </div>

  <div class="result-section" id="reviewSection"></div>

  <div class="result-actions">
    <button class="btn btn-ghost" onclick="resetQuiz()">↺ 새로 응시하기</button>
  </div>
</div>

<div class="saving-toast" id="savingToast"></div>

<script>

const QUIZ = [
  {num:1, text:"비가역(非可逆) 현상의 정의로 가장 알맞은 것은?", opts:["한쪽 방향으로만 진행되며, 그 반대 방향으로는 저절로 일어나지 않는 현상", "외부에서 일을 가하지 않으면 어느 방향으로도 진행되지 않는 현상", "양쪽 방향으로 똑같은 속도로 진행되는 현상", "에너지가 보존되지 않는 현상"], ans:1, exp:"비가역 현상은 자연계에서 한 방향으로만 진행되는 현상을 말합니다. 즉 '되돌릴 수 없는' 변화이며, 에너지 보존(1법칙)과는 별개로 자연이 흘러가는 방향에 관한 문제입니다."},
  {num:2, text:"다음 중 비가역 현상의 예로 보기 어려운 것은?", opts:["물에 떨어뜨린 잉크가 골고루 확산된다.", "성냥을 연소시키면 열과 빛이 방출된다.", "마찰이 전혀 없는 빗면에서 공이 미끄러져 내려간다.", "뜨거운 커피가 식어 주변 온도와 같아진다."], ans:3, exp:"마찰이 전혀 없는 이상적인 빗면에서의 운동은 역학적 에너지가 보존되어 원리적으로 가역적입니다. 잉크 확산·연소·열 평형은 모두 한 방향으로만 진행되는 비가역 현상입니다."},

  {num:4, text:"비가역 현상을 설명한 다음 두 문장의 빈칸에 들어갈 말을 옳게 짝지은 것은?\n· 물에 떨어뜨린 잉크는 ( ㉠ ) 한다.\n· 한쪽 방향으로 진행되는 현상을 ( ㉡ ) 현상이라 한다.", opts:["㉠ 응축 / ㉡ 가역", "㉠ 확산 / ㉡ 가역", "㉠ 응축 / ㉡ 비가역", "㉠ 확산 / ㉡ 비가역"], ans:4, exp:"잉크는 물에 골고루 '확산'되며, 한 방향으로만 진행되는 현상은 '비가역' 현상이라고 부릅니다."},
  {num:5, text:"열역학 제2법칙을 가장 잘 표현한 문장은?", opts:["에너지의 총량은 항상 보존된다.", "자연 현상에는 방향성이 있어 한쪽 방향으로만 자발적으로 진행된다.", "모든 변화는 양쪽 방향으로 동등하게 일어난다.", "온도는 절대 0K 이하로 내려갈 수 없다."], ans:2, exp:"열역학 제2법칙은 자연 현상의 비가역성(방향성)을 다룹니다. 에너지 보존은 제1법칙, 절대 0K 도달 불가는 제3법칙의 내용입니다."},
  {num:6, text:"비상교과서가 제시한 비가역 현상의 예 3가지에 포함되지 않는 것은?", opts:["열은 항상 고온의 물체에서 저온의 물체로 이동한다.", "기체가 된 향수 입자는 공기 중으로 확산된다.", "왕복 운동을 하는 진자는 운동에너지가 점점 감소하여 결국 멈추게 된다.", "자석을 가까이 가져가면 쇳가루가 자석에 달라붙는다."], ans:4, exp:"비상교과서가 제시한 3가지 예시는 열의 이동, 향수(기체)의 확산, 진자의 감쇠입니다. 자석과 쇳가루의 인력은 보존력에 의한 가역적인 상호작용이므로 비가역 현상의 예시로 적절하지 않습니다."},
  {num:7, text:"열역학 제2법칙이 다루는 핵심 주제로 가장 알맞은 것은?", opts:["에너지가 보존되는지 여부", "자연 현상의 진행 방향(방향성)", "힘과 가속도의 관계", "파동의 간섭과 회절"], ans:2, exp:"제2법칙의 본질은 '어느 방향으로 자연 현상이 진행되는가'를 다루는 것입니다. 에너지 보존은 제1법칙, 힘-가속도는 뉴턴 운동법칙, 간섭·회절은 파동 단원의 내용입니다."},
  {num:8, text:"열역학 제1법칙과 제2법칙의 관계로 옳은 것은?", opts:["제1법칙이 성립하면 제2법칙은 자동으로 성립한다.", "제1법칙은 에너지의 양에, 제2법칙은 변화의 방향에 관한 법칙이다.", "두 법칙은 동일한 내용을 다른 방식으로 표현한 것이다.", "제1법칙은 거시계에만, 제2법칙은 미시계에만 적용된다."], ans:2, exp:"제1법칙은 '에너지의 총량이 보존된다'는 양적 법칙이고, 제2법칙은 '자연 현상이 어떤 방향으로 진행되는가'를 다루는 방향성 법칙입니다. 둘은 서로 독립된 다른 내용을 다룹니다."},
  {num:9, text:"다음 자연 현상 중 열역학 제2법칙으로 설명할 수 있는 비가역성의 예가 아닌 것은?", opts:["열은 고온에서 저온으로만 자발적으로 이동한다.", "기체는 좁은 공간에서 넓은 공간으로 확산된다.", "진자는 공기 저항과 마찰로 결국 멈춘다.", "마찰이 전혀 없을 때 단진동하는 용수철은 영원히 진동한다."], ans:4, exp:"외부 마찰이 전혀 없는 이상적인 단진동은 가역적인 운동입니다. 나머지는 모두 한 방향으로만 자발적으로 진행되는 비가역 현상입니다."},
  {num:10, text:"클라우지우스가 정의한 엔트로피 변화량의 식으로 옳은 것은? (Q: 흡수한 열량, T: 절대온도)", opts:["ΔS = QT", "ΔS = T/Q", "ΔS = Q + T", "ΔS = Q/T"], ans:4, exp:"클라우지우스의 정의에 따르면 절대온도 T인 계에서 열량 Q를 흡수할 때 그 계의 엔트로피 변화량은 ΔS = Q/T 로 정의됩니다."},
  {num:11, text:"클라우지우스의 엔트로피 정의식 ΔS = Q/T 에서 각 기호의 의미로 옳지 않은 것은?", opts:["ΔS는 계의 엔트로피 변화량이다.", "Q는 계가 흡수한 열량이다.", "T는 섭씨 온도(℃)이다.", "단위는 J/K이다."], ans:3, exp:"클라우지우스의 식에 사용되는 T는 반드시 절대온도(K)입니다. 섭씨 온도를 그대로 대입하면 비물리적인 결과(0℃에서 분모가 0이 되는 등)가 발생합니다."},
  {num:12, text:"온도 300 K인 계가 외부로부터 600 J의 열을 흡수할 때 이 계의 엔트로피 변화량 ΔS는?", opts:["0.5 J/K", "2 J/K", "180000 J/K", "−2 J/K"], ans:2, exp:"ΔS = Q/T = 600 J / 300 K = 2 J/K. 열을 흡수했으므로 Q > 0이고, 따라서 엔트로피도 증가합니다."},
  {num:13, text:"동일한 양의 열 Q를 두 계에 각각 가하였다. 계 A의 온도는 200 K, 계 B의 온도는 400 K이다. 두 계의 엔트로피 변화량 ΔS_A와 ΔS_B의 대소 비교로 옳은 것은?", opts:["ΔS_A > ΔS_B", "ΔS_A = ΔS_B", "ΔS_A < ΔS_B", "비교할 수 없다"], ans:1, exp:"ΔS = Q/T 이고 Q가 같을 때 T가 작을수록 ΔS는 커집니다. 200 K가 400 K보다 작으므로 ΔS_A > ΔS_B 입니다."},
  {num:14, text:"[심화] 어떤 계가 같은 열량 Q를 두 번에 걸쳐 흡수하여 온도가 T₁(처음) → T₂(끝, T₂ > T₁)로 변하였다. 두 단계 엔트로피 변화량의 부호와 크기 비교로 옳은 것은?", opts:["두 단계 모두 ΔS > 0 이고, 첫 단계가 둘째 단계보다 크다.", "두 단계 모두 ΔS > 0 이고, 둘째 단계가 첫 단계보다 크다.", "첫 단계는 ΔS > 0, 둘째 단계는 ΔS < 0 이다.", "두 단계 모두 ΔS = 0 이다."], ans:1, exp:"열을 흡수하므로 두 단계 모두 ΔS > 0 입니다. ΔS = Q/T 에서 Q가 같다면 T가 작을수록 ΔS는 커지므로, 더 낮은 온도 T₁에서 열을 흡수한 첫 단계의 엔트로피 변화가 더 큽니다."},
  {num:15, text:"볼츠만이 정의한 엔트로피 식으로 옳은 것은? (k: 볼츠만 상수, W: 계를 구성하는 분자가 배열될 수 있는 상태의 수)", opts:["S = kW", "S = k·lnW", "S = W/k", "S = k/W"], ans:2, exp:"볼츠만의 엔트로피 정의는 S = k·lnW 입니다. 여기서 W는 그 거시 상태에 대응하는 미시 상태의 수(분자가 배열될 수 있는 경우의 수)입니다."},
  {num:16, text:"볼츠만 상수 k의 값으로 가장 가까운 것은?", opts:["k ≈ 1.38 × 10⁻²³ J/K", "k ≈ 6.02 × 10²³ /mol", "k ≈ 9.8 N/kg", "k ≈ 3.0 × 10⁸ m/s"], ans:1, exp:"볼츠만 상수의 값은 약 1.38 × 10⁻²³ J/K 입니다. 6.02×10²³은 아보가드로 수, 9.8 N/kg은 중력가속도, 3×10⁸ m/s는 광속입니다."},
  {num:17, text:"볼츠만 엔트로피 식 S = k·lnW 에서 W의 의미로 옳은 것은?", opts:["계에 가해진 열의 총량", "계의 절대온도", "계를 구성하는 분자가 배열될 수 있는 상태의 수", "계의 압력과 부피의 곱"], ans:3, exp:"W는 거시 상태에 대응하는 미시 상태(분자 배열 방식)의 수를 의미합니다. W가 클수록 그 상태는 더 '확률이 높은' 상태이며, 엔트로피도 큽니다."},
  {num:18, text:"어떤 계의 미시 상태 수 W가 처음 W₁에서 W₂로 증가하였다. 이때 엔트로피 변화 ΔS = S₂ − S₁은? (k: 볼츠만 상수)", opts:["ΔS = k(W₂ − W₁)", "ΔS = k · ln(W₂/W₁)", "ΔS = k · (W₂/W₁)", "ΔS = k · ln(W₁ − W₂)"], ans:2, exp:"S = k·lnW 이므로 ΔS = k·lnW₂ − k·lnW₁ = k·ln(W₂/W₁). W₂ > W₁이면 ΔS > 0이 되어 엔트로피가 증가합니다."},
  {num:19, text:"엔트로피로 표현한 열역학 제2법칙으로 옳은 것은?", opts:["고립계에서 자발적으로 일어나는 자연 현상의 엔트로피는 항상 증가한다 (ΔS > 0).", "고립계의 엔트로피는 항상 일정하다 (ΔS = 0).", "모든 계의 엔트로피는 외부 일에 의해서만 변한다.", "고립계의 엔트로피는 항상 감소한다 (ΔS < 0)."], ans:1, exp:"엔트로피로 표현된 열역학 제2법칙은 '고립계에서 자발적으로 일어나는 자연 현상의 엔트로피는 항상 증가한다 (ΔS > 0)'입니다."},
  {num:20, text:"고립계(isolated system)의 정의로 옳은 것은?", opts:["외부와 에너지는 주고받지만 물질은 주고받지 않는 계", "외부와 물질은 주고받지만 에너지는 주고받지 않는 계", "외부와 아무런 상호작용도 하지 않는 계", "외부와 자유롭게 에너지와 물질을 주고받는 계"], ans:3, exp:"고립계는 외부와 에너지·물질을 모두 주고받지 않는 계입니다. 열역학 제2법칙(ΔS > 0)은 고립계를 전제로 합니다."},
  {num:21, text:"향수병의 마개를 열었더니 향수 입자가 방 안 전체로 확산되었다. 이 과정에서 (방 + 향수)를 고립계로 볼 때 엔트로피 변화로 옳은 것은?", opts:["ΔS < 0 (감소)", "ΔS = 0 (변화 없음)", "ΔS > 0 (증가)", "주기적으로 증감을 반복한다."], ans:3, exp:"향수 입자가 좁은 공간에서 넓은 공간으로 확산되는 자발적 비가역 과정에서 분자가 배열될 수 있는 상태의 수 W가 증가하므로, 고립계 전체의 엔트로피는 증가합니다 (ΔS > 0)."},
  {num:22, text:"우주를 하나의 고립계로 간주할 때 옳은 설명을 모두 고른 것은?\n㉠ 우주의 총에너지는 일정하게 보존된다.\n㉡ 우주의 총엔트로피는 계속 증가한다.\n㉢ 우주의 엔트로피는 주기적으로 증감한다.", opts:["㉠만 옳다.", "㉠과 ㉡이 옳다.", "㉠과 ㉢이 옳다.", "㉡과 ㉢이 옳다."], ans:2, exp:"우주를 고립계로 보면 ㉠ 에너지 보존(제1법칙)과 ㉡ 엔트로피 증가(제2법칙)가 모두 성립합니다. 따라서 우주의 총에너지는 일정하고, 총엔트로피는 계속 증가합니다."},
  {num:23, text:"절대온도 T_H인 고열원에서 절대온도 T_L인 저열원으로 열량 Q가 이동하였다 (T_H > T_L, 두 열원의 온도는 일정 유지). 이때 두 열원의 엔트로피 변화량을 옳게 짝지은 것은?", opts:["ΔS_고열원 = +Q/T_H , ΔS_저열원 = +Q/T_L", "ΔS_고열원 = −Q/T_H , ΔS_저열원 = +Q/T_L", "ΔS_고열원 = +Q/T_H , ΔS_저열원 = −Q/T_L", "ΔS_고열원 = −Q/T_H , ΔS_저열원 = −Q/T_L"], ans:2, exp:"고열원은 열을 '방출'하므로 ΔS_고열원 = −Q/T_H, 저열원은 열을 '흡수'하므로 ΔS_저열원 = +Q/T_L 입니다."},
  {num:24, text:"절대온도 T_H인 고열원에서 절대온도 T_L인 저열원으로 열량 Q가 이동할 때 전체 엔트로피 변화량 ΔS_total을 옳게 나타낸 것은?", opts:["ΔS_total = Q (1/T_L − 1/T_H)", "ΔS_total = Q (1/T_H − 1/T_L)", "ΔS_total = Q (1/T_H + 1/T_L)", "ΔS_total = Q (T_L − T_H)"], ans:1, exp:"고열원의 ΔS = −Q/T_H, 저열원의 ΔS = +Q/T_L 이므로 두 변화의 합은 ΔS_total = Q/T_L − Q/T_H = Q(1/T_L − 1/T_H)."},
  {num:25, text:"식 ΔS_total = Q (1/T_L − 1/T_H) 에서 T_H > T_L 일 때 ΔS_total의 부호와 그 의미로 옳은 것은?", opts:["ΔS_total < 0 이며 가역적이다.", "ΔS_total = 0 이며 가역적이다.", "ΔS_total > 0 이며 비가역적이다.", "ΔS_total > 0 이지만 가역적이다."], ans:3, exp:"T_H > T_L 이면 1/T_L > 1/T_H 이므로 ΔS_total > 0 이며, 이는 열이 고온에서 저온으로 이동하는 과정이 비가역적임을 의미합니다."},
  {num:26, text:"400 K인 고열원에서 200 K인 저열원으로 1000 J의 열량이 이동하였다. (두 열원의 온도는 변하지 않는다.) 전체 엔트로피 변화량 ΔS_total은?", opts:["0 J/K", "2.5 J/K", "−2.5 J/K", "7.5 J/K"], ans:2, exp:"ΔS_total = Q(1/T_L − 1/T_H) = 1000 × (1/200 − 1/400) = 1000 × (1/400) = 2.5 J/K. 부호가 양수이므로 비가역적임을 알 수 있습니다."},
  {num:27, text:"[심화] 절대온도 T_H인 고열원에서 절대온도 T_L인 저열원으로 같은 열량 Q가 이동할 때, 두 열원의 온도차 (T_H − T_L)이 매우 작아 두 온도가 거의 같아진다고 하자. 전체 엔트로피 변화량 ΔS_total에 대한 설명으로 옳은 것은?", opts:["ΔS_total은 0에 수렴하며 과정이 가역에 가까워진다.", "ΔS_total은 무한대로 발산한다.", "ΔS_total은 항상 음수가 된다.", "ΔS_total은 두 열원의 온도와 무관하다."], ans:1, exp:"ΔS_total = Q(1/T_L − 1/T_H) 에서 T_L → T_H 이면 괄호 안 값이 0으로 수렴하여 ΔS_total → 0. 즉 온도차가 매우 작은 열의 이동은 거의 가역적(준정적) 과정으로 볼 수 있습니다."},
  {num:28, text:"N개의 기체 분자가 자유롭게 이동할 수 있는 두 공간(A, B)으로 연결된 용기가 있다. 분자가 배열될 수 있는 미시 상태의 수 W로 옳은 것은?", opts:["W = 2N", "W = N²", "W = 2^N", "W = N!"], ans:3, exp:"분자 1개당 A 또는 B 두 곳 중 한 곳에 있을 수 있으므로 상태 수는 2가지. 분자 N개에 대해 각각 독립이므로 전체 상태 수 W = 2 × 2 × … × 2 = 2^N 입니다."},
  {num:29, text:"두 공간 A, B로 분리된 용기에 4개의 기체 분자가 들어 있다. 분자가 배열될 수 있는 전체 미시 상태의 수 W는?", opts:["4", "8", "16", "32"], ans:3, exp:"분자 4개가 각각 A 또는 B 두 곳에 위치할 수 있으므로 W = 2⁴ = 16 입니다."},
  {num:30, text:"두 공간 A, B로 분리된 용기에 4개의 분자가 있을 때, '4개 모두 A에 모여 있는' 경우의 수와 'A와 B에 2개씩 분포하는' 경우의 수를 옳게 짝지은 것은? (분자는 서로 구별된다고 가정)", opts:["4모두 A: 1가지 / 2개씩: 6가지", "4모두 A: 4가지 / 2개씩: 4가지", "4모두 A: 1가지 / 2개씩: 4가지", "4모두 A: 6가지 / 2개씩: 1가지"], ans:1, exp:"'4개 모두 A'는 단 1가지(모든 분자가 A). '2개씩 균등 분포'는 4개 중 A에 갈 2개를 고르는 경우로 ₄C₂ = 6가지입니다."},

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let userName = '', userSchool = '', userPhone = '';
let userAnswers = {}; // num → chosen index (1~4)
let timerInterval = null;
let elapsedSec = 0;
let quizStarted = false;

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function toast(msg, duration = 2500) {
  const el = document.getElementById('savingToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ══════════════════════════════════════
// SCREEN 1 → 시작
// ══════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교를 입력해주세요.'); return; }
  if (!/^[0-9]{4}$/.test(phone)) { alert('전화번호 뒷자리 4자리(숫자)를 입력해주세요.'); return; }

  userName = name;
  userSchool = school;
  userPhone = phone;
  userAnswers = {};
  elapsedSec = 0;

  renderQuiz();
  showScreen('screen-quiz');
  startTimer();
}

// ══════════════════════════════════════
// 타이머
// ══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(elapsedSec);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

// ══════════════════════════════════════
// 퀴즈 렌더
// ══════════════════════════════════════
const LABELS = ['①','②','③','④'];

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = QUIZ.map(q => `
    <div class="q-card" id="qcard-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="q-options">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="opt-${q.num}-${i+1}" onclick="selectOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');
  updateProgress();
}

function selectOpt(num, chosen) {
  userAnswers[num] = chosen;

  // 선택 표시
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`opt-${num}-${i}`);
    btn.style.borderColor = i === chosen ? 'var(--accent)' : '';
    btn.style.background = i === chosen ? 'var(--accent-light)' : '';
  }
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const total = QUIZ.length;
  document.getElementById('metaProgress').textContent = `${answered} / ${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

// ══════════════════════════════════════
// 제출
// ══════════════════════════════════════
function submitQuiz() {
  const answered = Object.keys(userAnswers).length;
  if (answered < QUIZ.length) {
    if (!confirm(`아직 ${QUIZ.length - answered}문제가 남아 있어요. 제출하시겠어요?`)) return;
  }
  stopTimer();
  showResult();
}

// ══════════════════════════════════════
// 결과
// ══════════════════════════════════════
function showResult() {
  const correct = QUIZ.filter(q => userAnswers[q.num] === q.ans);
  const wrong   = QUIZ.filter(q => userAnswers[q.num] !== q.ans);
  const score   = correct.length;
  const total   = QUIZ.length;

  document.getElementById('resultName').textContent = `${userName} · ${userSchool} · ${userPhone}`;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultScoreSub').textContent = `/ ${total} 문항`;
  document.getElementById('statTime').textContent = fmtTime(elapsedSec);
  document.getElementById('statCorrect').textContent = `${score}개`;
  document.getElementById('statWrong').textContent = `${wrong.length}개`;

  // 오답 리뷰
  const reviewSection = document.getElementById('reviewSection');
  if (wrong.length === 0) {
    reviewSection.innerHTML = `<div style="text-align:center;padding:32px 0;color:var(--accent);font-weight:700;">🎉 전부 맞혔어요!</div>`;
  } else {
    reviewSection.innerHTML = `
      <h2>틀린 문제 <span class="badge-wrong">${wrong.length}문제</span></h2>
      ${wrong.map(q => renderReviewCard(q)).join('')}
    `;
  }

  showScreen('screen-result');
  saveScore(score, total);
}

function renderReviewCard(q) {
  return `
    <div class="review-card" id="review-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="review-retry-wrap" id="retry-opts-${q.num}">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="retry-opt-${q.num}-${i+1}" onclick="retryOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="review-exp">
        <div class="review-exp-label">✦ 해설</div>
        <p>${q.exp}</p>
      </div>
    </div>
  `;
}

function retryOpt(num, chosen) {
  const q = QUIZ.find(x => x.num === num);
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`retry-opt-${num}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.ans) btn.className = 'opt-btn correct';
    else if (i === chosen && chosen !== q.ans) btn.className = 'opt-btn wrong';
    else btn.className = 'opt-btn reveal';
  }
}

// ══════════════════════════════════════
// 점수 저장 (Google Sheets 주 저장소 + Airtable 병행)
// ══════════════════════════════════════
function buildPayload(score, total) {
  return {
    '이름': userName,
    '학교': userSchool,
    'phone_last4': userPhone,
    '날짜': new Date().toISOString().split('T')[0],
    '과목코드': QUIZ_META.subjectCode,
    '과목명': QUIZ_META.subjectName,
    '대단원번호': QUIZ_META.mainNo,
    '대단원명': QUIZ_META.mainName,
    '중단원번호': QUIZ_META.subNo,
    '중단원명': QUIZ_META.subName,
    '섹션번호': QUIZ_META.sectionNo,
    '섹션명': QUIZ_META.sectionName,
    '총점': score,
    '총문항수': total,
    '풀이시간': fmtTime(elapsedSec)
  };
}

async function saveToSheets(payload) {
  // Content-Type을 text/plain 으로 보내야 preflight(OPTIONS)가 생기지 않음.
  // Apps Script 웹앱은 OPTIONS를 처리하지 못하므로 이 설정이 필수.
  const res = await fetch(GS_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.ok !== true) throw new Error(data.error || 'sheets rejected');
  return data;
}

async function saveToAirtable(payload) {
  const res = await fetch(`https://api.airtable.com/v0/${AT_BASE}/${AT_SCORES}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${AT_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ fields: payload })
  });
  if (!res.ok) throw new Error('airtable ' + res.status);
  return true;
}

async function saveScore(score, total) {
  toast('점수 저장 중...');
  const payload = buildPayload(score, total);

  const jobs = [saveToSheets(payload)];
  if (DUAL_WRITE) jobs.push(saveToAirtable(payload));

  const results = await Promise.allSettled(jobs);
  const sheetsOk   = results[0].status === 'fulfilled';
  const airtableOk = DUAL_WRITE ? results[1].status === 'fulfilled' : false;

  if (!sheetsOk) console.warn('[Sheets 저장 실패]', results[0].reason);
  if (DUAL_WRITE && !airtableOk) console.warn('[Airtable 저장 실패]', results[1].reason);

  if (sheetsOk || airtableOk) {
    toast('✓ 점수가 저장되었습니다.');
  } else {
    toast('저장 실패 — 네트워크를 확인해주세요.');
  }
}

// ══════════════════════════════════════
// 리셋
// ══════════════════════════════════════
function resetQuiz() {
  userName = '';
  userSchool = '';
  userPhone = '';
  userAnswers = {};
  elapsedSec = 0;
  document.getElementById('input-name').value = '';
  document.getElementById('input-school').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('timerDisplay').textContent = '00:00';
  showScreen('screen-intro');
}
</script>
