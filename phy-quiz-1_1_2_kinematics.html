<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>등가속도 운동 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}

/* ── 공통 ── */
.screen { display: none; }
.screen.active { display: block; }

.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

h1 {
  font-size: 1.6rem;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 14px 28px;
  font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
  width: 100%;
}

.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }

.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-ghost:hover { background: var(--accent-light); opacity: 1; }

/* ── SCREEN 1: 입력 ── */
#screen-intro {
  padding-top: 80px;
}

.intro-header {
  text-align: center;
  margin-bottom: 48px;
}

.intro-header .tag {
  display: inline-block;
  background: var(--accent-light);
  color: var(--accent);
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
  padding: 4px 12px;
  border-radius: 20px;
  margin-bottom: 16px;
  letter-spacing: 0.08em;
}

.intro-header h1 { margin-bottom: 8px; }
.intro-header p { color: var(--text-dim); font-size: 0.9rem; }

.form-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 8px;
  letter-spacing: 0.04em;
}

.form-group input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 1rem;
  font-family: 'Noto Sans KR', sans-serif;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus { border-color: var(--accent); }

.form-info {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  background: var(--accent-light);
  border-radius: 10px;
  padding: 14px 16px;
}

.form-info span {
  font-size: 0.82rem;
  color: var(--accent);
}

/* ── SCREEN 2: 퀴즈 ── */
#screen-quiz { padding-top: 0; }

.quiz-topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
}

.quiz-topbar-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
}

.progress-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 99px;
  height: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 6px;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.4s ease;
}

.quiz-meta {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-shrink: 0;
}

.meta-item {
  font-family: 'DM Mono', monospace;
  font-size: 0.78rem;
  color: var(--text-dim);
}

.meta-item span {
  color: var(--text);
  font-weight: 500;
}

.quiz-body {
  padding: 32px 20px;
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color 0.3s;
}

.q-card.correct { border-color: var(--correct); }
.q-card.wrong { border-color: var(--wrong); }

.q-head {
  padding: 20px 24px 16px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.q-num {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--text-dim);
  white-space: nowrap;
  margin-top: 3px;
  flex-shrink: 0;
}

.q-text {
  font-size: 0.93rem;
  line-height: 1.75;
  white-space: pre-line;
}

.q-options {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.opt-btn {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 0.88rem;
  line-height: 1.5;
  color: var(--text);
  transition: all 0.15s;
  width: 100%;
}

.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
}

.opt-btn:disabled { cursor: default; }

.opt-btn.correct {
  border-color: var(--correct);
  background: var(--correct-light);
  color: var(--correct);
}

.opt-btn.wrong {
  border-color: var(--wrong);
  background: var(--wrong-light);
  color: var(--wrong);
}

.opt-btn.reveal {
  border-color: rgba(45,90,61,0.35);
  background: rgba(45,90,61,0.04);
  color: rgba(45,90,61,0.6);
}

.opt-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.15s;
}

.opt-btn.correct .opt-label { background: var(--correct); border-color: var(--correct); color: #fff; }
.opt-btn.wrong .opt-label { background: var(--wrong); border-color: var(--wrong); color: #fff; }

/* submit btn area */
.submit-wrap {
  padding: 0 20px 40px;
  max-width: 720px;
  margin: 0 auto;
}

/* ── SCREEN 3: 결과 ── */
#screen-result { padding-top: 48px; }

.result-hero {
  text-align: center;
  padding: 48px 20px 32px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}

.result-name {
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-bottom: 6px;
  font-family: 'DM Mono', monospace;
}

.result-score {
  font-size: 4rem;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  letter-spacing: -0.04em;
  margin-bottom: 4px;
}

.result-score-sub {
  font-size: 1rem;
  color: var(--text-dim);
  margin-bottom: 24px;
}

.result-stats {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.stat-item {
  text-align: center;
}

.stat-val {
  font-family: 'DM Mono', monospace;
  font-size: 1.3rem;
  font-weight: 500;
  color: var(--text);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 2px;
}

.result-section {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

.result-section h2 {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.badge-wrong {
  background: var(--wrong-light);
  color: var(--wrong);
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 20px;
  font-family: 'DM Mono', monospace;
}

/* review card */
.review-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.review-card .q-head { padding-bottom: 12px; }

.review-exp {
  padding: 14px 24px 18px;
  border-top: 1px solid var(--border);
  background: var(--accent-light);
}

.review-exp-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  color: var(--accent);
  margin-bottom: 5px;
  letter-spacing: 0.06em;
}

.review-exp p {
  font-size: 0.84rem;
  color: var(--accent);
  line-height: 1.65;
}

.review-retry-wrap {
  padding: 0 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.result-actions {
  max-width: 720px;
  margin: 32px auto 0;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* saving overlay */
.saving-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--text);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-family: 'DM Mono', monospace;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}

.saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══════════════════════════════════════
     SCREEN 1: 이름 / 학교 입력
══════════════════════════════════════ -->
<div id="screen-intro" class="screen active">
  <div class="container">
    <div class="intro-header">
      <div class="tag">PHYSICS QUIZ</div>
      <h1>등가속도 운동</h1>
      <p>물리학 · 1단원 힘과 에너지 · 1중단원 힘과 운동 · 2섹션</p>
    </div>

    <div class="form-card">
      <div class="form-info">
        <span>📋 총 20문항 · 객관식 4지선다 · 시간 제한 없음</span>
      </div>

      <div class="form-group">
        <label>이름</label>
        <input type="text" id="input-name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="input-school" placeholder="○○고등학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>전화번호 뒷자리 4자리 <span style="color:var(--text-dim);font-weight:300;">(동명이인 구별용)</span></label>
        <input type="tel" id="input-phone" placeholder="1234" autocomplete="off" maxlength="4" inputmode="numeric" pattern="[0-9]{4}">
      </div>

      <button class="btn" onclick="startQuiz()">시작하기 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 2: 퀴즈
══════════════════════════════════════ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-topbar">
    <div class="quiz-topbar-inner">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="quiz-meta">
        <div class="meta-item" id="metaProgress">0 / 20</div>
        <div class="meta-item">⏱ <span id="timerDisplay">00:00</span></div>
      </div>
    </div>
  </div>

  <div class="quiz-body" id="quizBody"></div>

  <div class="submit-wrap">
    <button class="btn" onclick="submitQuiz()">제출하기</button>
  </div>
</div>

<!-- ══════════════════════════════════════
     SCREEN 3: 결과
══════════════════════════════════════ -->
<div id="screen-result" class="screen">
  <div class="result-hero">
    <div class="result-name" id="resultName"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score-sub" id="resultScoreSub"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-val" id="statTime"></div>
        <div class="stat-label">풀이 시간</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statCorrect"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statWrong"></div>
        <div class="stat-label">오답</div>
      </div>
    </div>
  </div>

  <div class="result-section" id="reviewSection"></div>

  <div class="result-actions">
    <button class="btn btn-ghost" onclick="resetQuiz()">↺ 새로 응시하기</button>
  </div>
</div>

<div class="saving-toast" id="savingToast"></div>

<script>
// ══════════════════════════════════════
// Airtable 설정
// ══════════════════════════════════════
const AT_TOKEN   = "patBcLElKAr7fPbgS.0f288a25e39501f27d9d33569371fc819acb54173cf44daa68fc028f16e479f9";
const AT_BASE    = "appmCOjqp5xIJuPqt";
const AT_SCORES  = "scores";

// ── Google Sheets 웹앱 (주 저장소) ──
const GS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzay6SAgvghcFDisFxk32UjxOpSg7aa7k85PrlqIYYE6fuCrAZAsbb_yyQI6N06y0zzrA/exec";
const DUAL_WRITE  = true;   // 전환 완료 후 false 로 바꾸면 Airtable 전송 중단

// ══════════════════════════════════════
// 퀴즈 메타
// ══════════════════════════════════════
const QUIZ_META = {
  subjectCode: "PHY",
  subjectName: "물리학",
  mainNo:      1,
  mainName:    "힘과 에너지",
  subNo:       1,
  subName:     "힘과 운동",
  sectionNo:   2,
  sectionName: "등가속도 운동"
};

// ══════════════════════════════════════
// 퀴즈 데이터
// ══════════════════════════════════════
// ══════════════════════════════════════
// 1-1-2 등가속도 운동 (20문항, ba 15 + ad 5)
// 정답 시퀀스: A(2):3,2 / B(3):3,3,1 / C(2):4,1 / D(2):4,1
//              E(3):1,4,4 / F(3):2,2,2 / G(5):2,3,3,1,4
// ══════════════════════════════════════
const QUIZ = [
  // ══════════════════════════════════════
  // 블록 A. 이동거리 vs 변위 (Q1~Q2)
  // ══════════════════════════════════════
  {num:1, text:"'이동 거리'와 '변위'의 차이로 옳은 것은?", opts:["이동 거리와 변위는 완전히 같다.", "이동 거리는 방향이 있고, 변위는 방향이 없다.", "이동 거리는 물체가 실제로 움직인 총 거리이고, 변위는 처음 위치에서 나중 위치까지의 직선 거리와 방향이다.", "이동 거리는 항상 변위보다 작다."], ans:3, exp:"이동 거리는 실제로 움직인 총 거리(크기만 있음)이고, 변위는 처음 위치에서 나중 위치를 잇는 직선의 거리와 방향(벡터)입니다."},

  {num:2, text:"어떤 사람이 동쪽으로 10 m 이동한 후 서쪽으로 20 m 이동했다. 이동 거리와 변위의 크기로 옳은 것은?", opts:["이동 거리 10 m, 변위 크기 30 m", "이동 거리 30 m, 변위 크기 10 m (서쪽)", "이동 거리 30 m, 변위 크기 30 m", "이동 거리 10 m, 변위 크기 20 m"], ans:2, exp:"이동 거리는 실제로 움직인 총 거리이므로 10 + 20 = 30 m. 변위의 크기는 처음~나중 위치 사이의 직선 거리로 |10 − 20| = 10 m, 방향은 서쪽입니다."},

  // ══════════════════════════════════════
  // 블록 B. 속력 vs 속도 (Q3~Q5)
  // ══════════════════════════════════════
  {num:3, text:"'속력'과 '속도'의 차이로 옳은 것은?", opts:["속력은 방향이 있고 속도는 방향이 없다.", "둘은 완전히 같은 물리량이다.", "속력은 크기만 있는 물리량이고, 속도는 크기와 방향을 함께 나타내는 물리량이다.", "속력은 단위가 없고 속도만 단위가 있다."], ans:3, exp:"속력은 빠르기만을 나타내는 물리량(크기만 있음)이고, 속도는 빠르기와 방향을 함께 나타내는 벡터량입니다."},

  {num:4, text:"[심화] '평균 속력'과 '평균 속도'의 정의로 옳은 것은?", opts:["평균 속력 = 전체 변위 / 전체 시간, 평균 속도 = 전체 이동거리 / 전체 시간", "평균 속력과 평균 속도는 항상 같다.", "평균 속력 = 전체 이동거리 / 전체 시간, 평균 속도 = 전체 변위 / 전체 시간", "평균 속력 = 처음 속력 / 나중 속력"], ans:3, exp:"평균 속력 = 전체 이동거리 / 걸린 시간, 평균 속도 = 전체 변위 / 걸린 시간. 왕복 운동에서는 두 값이 다릅니다."},

  {num:5, text:"'순간 속도'와 '순간 속력'의 정의로 옳은 것은?", opts:["어느 한 순간에서의 속도(방향 포함)와 속력(크기)이다.", "긴 시간 동안의 평균 값이다.", "물체가 정지한 순간의 속도이다.", "가속도와 같은 물리량이다."], ans:1, exp:"순간 속도는 매우 짧은 순간의 속도(방향 포함)이고, 순간 속력은 그 순간 속도의 크기(방향 무관)입니다."},

  // ══════════════════════════════════════
  // 블록 C. 가속도의 정의 (Q6~Q7)
  // ══════════════════════════════════════
  {num:6, text:"'가속도'의 정의로 옳은 것은?", opts:["단위 시간 동안의 이동 거리", "단위 시간 동안의 변위", "단위 시간 동안의 힘의 변화량", "단위 시간 동안의 속도 변화량"], ans:4, exp:"가속도는 물체의 속도가 시간에 따라 변하는 정도를 나타내는 물리량으로, 단위 시간 동안의 속도 변화량입니다. a = Δv/Δt."},

  {num:7, text:"가속도의 SI 단위로 옳은 것은?", opts:["m/s²", "m/s", "kg·m/s", "N"], ans:1, exp:"가속도의 단위는 m/s² (미터 매 초 제곱)입니다. 속도(m/s)를 시간(s)으로 나눈 것과 같은 형태."},

  // ══════════════════════════════════════

// ══════════════════════════════════════
// 상태
// ══════════════════════════════════════
let userName = '', userSchool = '', userPhone = '';
let userAnswers = {}; // num → chosen index (1~4)
let timerInterval = null;
let elapsedSec = 0;
let quizStarted = false;

// ══════════════════════════════════════
// 유틸
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return `${m}:${s}`;
}

function toast(msg, duration = 2500) {
  const el = document.getElementById('savingToast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

// ══════════════════════════════════════
// SCREEN 1 → 시작
// ══════════════════════════════════════
function startQuiz() {
  const name = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  if (!name) { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교를 입력해주세요.'); return; }
  if (!/^[0-9]{4}$/.test(phone)) { alert('전화번호 뒷자리 4자리(숫자)를 입력해주세요.'); return; }

  userName = name;
  userSchool = school;
  userPhone = phone;
  userAnswers = {};
  elapsedSec = 0;

  renderQuiz();
  showScreen('screen-quiz');
  startTimer();
}

// ══════════════════════════════════════
// 타이머
// ══════════════════════════════════════
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(elapsedSec);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
}

// ══════════════════════════════════════
// 퀴즈 렌더
// ══════════════════════════════════════
const LABELS = ['①','②','③','④'];

function renderQuiz() {
  const body = document.getElementById('quizBody');
  body.innerHTML = QUIZ.map(q => `
    <div class="q-card" id="qcard-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="q-options">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="opt-${q.num}-${i+1}" onclick="selectOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `).join('');
  updateProgress();
}

function selectOpt(num, chosen) {
  userAnswers[num] = chosen;

  // 선택 표시
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`opt-${num}-${i}`);
    btn.style.borderColor = i === chosen ? 'var(--accent)' : '';
    btn.style.background = i === chosen ? 'var(--accent-light)' : '';
  }
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  const total = QUIZ.length;
  document.getElementById('metaProgress').textContent = `${answered} / ${total}`;
  document.getElementById('progressFill').style.width = `${(answered / total) * 100}%`;
}

// ══════════════════════════════════════
// 제출
// ══════════════════════════════════════
function submitQuiz() {
  const answered = Object.keys(userAnswers).length;
  if (answered < QUIZ.length) {
    if (!confirm(`아직 ${QUIZ.length - answered}문제가 남아 있어요. 제출하시겠어요?`)) return;
  }
  stopTimer();
  showResult();
}

// ══════════════════════════════════════
// 결과
// ══════════════════════════════════════
function showResult() {
  const correct = QUIZ.filter(q => userAnswers[q.num] === q.ans);
  const wrong   = QUIZ.filter(q => userAnswers[q.num] !== q.ans);
  const score   = correct.length;
  const total   = QUIZ.length;

  document.getElementById('resultName').textContent = `${userName} · ${userSchool} · ${userPhone}`;
  document.getElementById('resultScore').textContent = score;
  document.getElementById('resultScoreSub').textContent = `/ ${total} 문항`;
  document.getElementById('statTime').textContent = fmtTime(elapsedSec);
  document.getElementById('statCorrect').textContent = `${score}개`;
  document.getElementById('statWrong').textContent = `${wrong.length}개`;

  // 오답 리뷰
  const reviewSection = document.getElementById('reviewSection');
  if (wrong.length === 0) {
    reviewSection.innerHTML = `<div style="text-align:center;padding:32px 0;color:var(--accent);font-weight:700;">🎉 전부 맞혔어요!</div>`;
  } else {
    reviewSection.innerHTML = `
      <h2>틀린 문제 <span class="badge-wrong">${wrong.length}문제</span></h2>
      ${wrong.map(q => renderReviewCard(q)).join('')}
    `;
  }

  showScreen('screen-result');
  saveScore(score, total);
}

function renderReviewCard(q) {
  return `
    <div class="review-card" id="review-${q.num}">
      <div class="q-head">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-text">${q.text}</span>
      </div>
      <div class="review-retry-wrap" id="retry-opts-${q.num}">
        ${q.opts.map((opt, i) => `
          <button class="opt-btn" id="retry-opt-${q.num}-${i+1}" onclick="retryOpt(${q.num}, ${i+1})">
            <span class="opt-label">${LABELS[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div class="review-exp">
        <div class="review-exp-label">✦ 해설</div>
        <p>${q.exp}</p>
      </div>
    </div>
  `;
}

function retryOpt(num, chosen) {
  const q = QUIZ.find(x => x.num === num);
  for (let i = 1; i <= 4; i++) {
    const btn = document.getElementById(`retry-opt-${num}-${i}`);
    if (!btn) continue;
    btn.disabled = true;
    if (i === q.ans) btn.className = 'opt-btn correct';
    else if (i === chosen && chosen !== q.ans) btn.className = 'opt-btn wrong';
    else btn.className = 'opt-btn reveal';
  }
}

// ══════════════════════════════════════
// 점수 저장 (Google Sheets 주 저장소 + Airtable 병행)
// ══════════════════════════════════════
function buildPayload(score, total) {
  return {
    '이름': userName,
    '학교': userSchool,
    'phone_last4': userPhone,
    '날짜': new Date().toISOString().split('T')[0],
    '과목코드': QUIZ_META.subjectCode,
    '과목명': QUIZ_META.subjectName,
    '대단원번호': QUIZ_META.mainNo,
    '대단원명': QUIZ_META.mainName,
    '중단원번호': QUIZ_META.subNo,
    '중단원명': QUIZ_META.subName,
    '섹션번호': QUIZ_META.sectionNo,
    '섹션명': QUIZ_META.sectionName,
    '총점': score,
    '총문항수': total,
    '풀이시간': fmtTime(elapsedSec)
  };
}

async function saveToSheets(payload) {
  // Content-Type을 text/plain 으로 보내야 preflight(OPTIONS)가 생기지 않음.
  // Apps Script 웹앱은 OPTIONS를 처리하지 못하므로 이 설정이 필수.
  const res = await fetch(GS_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  if (data.ok !== true) throw new Error(data.error || 'sheets rejected');
  return data;
}

async function saveToAirtable(payload) {
  const res = await fetch(`https://api.airtable.com/v0/${AT_BASE}/${AT_SCORES}`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${AT_TOKEN}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ fields: payload })
  });
  if (!res.ok) throw new Error('airtable ' + res.status);
  return true;
}

async function saveScore(score, total) {
  toast('점수 저장 중...');
  const payload = buildPayload(score, total);

  const jobs = [saveToSheets(payload)];
  if (DUAL_WRITE) jobs.push(saveToAirtable(payload));

  const results = await Promise.allSettled(jobs);
  const sheetsOk   = results[0].status === 'fulfilled';
  const airtableOk = DUAL_WRITE ? results[1].status === 'fulfilled' : false;

  if (!sheetsOk) console.warn('[Sheets 저장 실패]', results[0].reason);
  if (DUAL_WRITE && !airtableOk) console.warn('[Airtable 저장 실패]', results[1].reason);

  if (sheetsOk || airtableOk) {
    toast('✓ 점수가 저장되었습니다.');
  } else {
    toast('저장 실패 — 네트워크를 확인해주세요.');
  }
}

// ══════════════════════════════════════
// 리셋
// ══════════════════════════════════════
function resetQuiz() {
  userName = '';
  userSchool = '';
  userPhone = '';
  userAnswers = {};
  elapsedSec = 0;
  document.getElementById('input-name').value = '';
  document.getElementById('input-school').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('timerDisplay').textContent = '00:00';
  showScreen('screen-intro');
}
</script>
