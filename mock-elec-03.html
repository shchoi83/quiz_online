<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전기 모의고사 3차 · 물리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f5f0;
  --surface: #ffffff;
  --border: #e2ddd6;
  --text: #1a1714;
  --text-dim: #8a8480;
  --accent: #2d5a3d;
  --accent-light: #e8f0eb;
  --wrong: #c0392b;
  --wrong-light: #fdf0ef;
  --correct: #2d5a3d;
  --correct-light: #e8f0eb;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 0 0 60px;
}
.screen { display: none; }
.screen.active { display: block; }
.container { max-width: 720px; margin: 0 auto; padding: 0 20px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; background: var(--accent); color: #fff; border: none;
  border-radius: var(--radius); padding: 14px 28px; font-size: 0.95rem;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 500;
  cursor: pointer; transition: opacity 0.2s, transform 0.1s; width: 100%;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn-ghost {
  background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
}
.btn-ghost:hover { background: var(--accent-light); opacity: 1; }
#screen-intro { padding-top: 80px; }
.intro-header { text-align: center; margin-bottom: 48px; }
.intro-header .tag {
  display: inline-block; background: var(--accent-light); color: var(--accent);
  font-family: 'DM Mono', monospace; font-size: 0.72rem; padding: 4px 12px;
  border-radius: 20px; margin-bottom: 16px; letter-spacing: 0.08em;
}
.intro-header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
.intro-header p { color: var(--text-dim); font-size: 0.9rem; }
.form-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 32px; box-shadow: var(--shadow);
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 0.82rem; font-weight: 500;
  color: var(--text-dim); margin-bottom: 8px; letter-spacing: 0.04em;
}
.form-group input {
  width: 100%; background: var(--bg); border: 1.5px solid var(--border);
  border-radius: 10px; padding: 13px 16px; font-size: 1rem;
  font-family: 'Noto Sans KR', sans-serif; color: var(--text);
  outline: none; transition: border-color 0.2s;
}
.form-group input:focus { border-color: var(--accent); }
.form-info {
  display: flex; gap: 12px; margin-bottom: 24px;
  background: var(--accent-light); border-radius: 10px; padding: 14px 16px;
}
.form-info span { font-size: 0.82rem; color: var(--accent); }
#screen-quiz { padding-top: 0; }
.quiz-topbar {
  position: sticky; top: 0; z-index: 50; background: var(--surface);
  border-bottom: 1px solid var(--border); padding: 14px 20px;
}
.quiz-topbar-inner {
  max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 16px;
}
.progress-wrap {
  flex: 1; background: var(--border); border-radius: 99px; height: 6px; overflow: hidden;
}
.progress-fill {
  height: 6px; background: var(--accent); border-radius: 99px; transition: width 0.4s ease;
}
.meta-row { display: flex; gap: 16px; align-items: center; flex-shrink: 0; }
.meta-item { font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--text-dim); }
.meta-item span { color: var(--text); font-weight: 500; }
.answer-body { padding: 28px 20px; max-width: 720px; margin: 0 auto; }
.answer-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}
.answer-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.answer-row.selected { border-color: var(--accent); }
.q-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  color: var(--text-dim);
  flex-shrink: 0;
  min-width: 40px;
  text-align: center;
}
.choice-btns {
  display: flex;
  gap: 5px;
  flex: 1;
}
.choice-btn {
  flex: 1;
  height: 36px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'DM Mono', monospace;
  font-size: 0.82rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
  font-weight: 500;
}
.choice-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.choice-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.submit-wrap { padding: 8px 20px 40px; max-width: 720px; margin: 0 auto; }
#screen-result { padding-top: 48px; }
.result-hero {
  text-align: center; padding: 52px 20px 40px; background: var(--surface);
  border-bottom: 1px solid var(--border); margin-bottom: 36px;
}
.result-tag {
  display: inline-block; background: var(--accent-light); color: var(--accent);
  font-family: 'DM Mono', monospace; font-size: 0.72rem; padding: 4px 12px;
  border-radius: 20px; margin-bottom: 16px; letter-spacing: 0.08em;
}
.result-name { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 10px; font-family: 'DM Mono', monospace; }
.result-score {
  font-size: 5rem; font-weight: 700; color: var(--accent);
  line-height: 1; letter-spacing: -0.04em; margin-bottom: 6px;
}
.result-score-sub { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 32px; }
.result-stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
.stat-item { text-align: center; }
.stat-val { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 500; color: var(--text); }
.stat-label { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }
.score-table-wrap { max-width: 720px; margin: 0 auto; padding: 0 20px 32px; }
.score-table-wrap h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; color: var(--text); }
.score-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
  gap: 6px;
}
.score-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  border: 1.5px solid var(--border);
}
.score-cell .cell-num { color: var(--text-dim); font-size: 0.6rem; }
.score-cell .cell-ans { font-size: 0.82rem; font-weight: 500; }
.score-cell.ok { background: var(--correct-light); border-color: var(--correct); }
.score-cell.ok .cell-ans { color: var(--correct); }
.score-cell.fail { background: var(--wrong-light); border-color: var(--wrong); }
.score-cell.fail .cell-ans { color: var(--wrong); }
.score-cell.blank { background: var(--bg); }
.score-cell.blank .cell-ans { color: var(--text-dim); }
.result-actions { max-width: 720px; margin: 0 auto; padding: 0 20px; }
.saving-toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; font-size: 0.82rem;
  font-family: 'DM Mono', monospace; padding: 10px 22px; border-radius: 99px;
  opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 100;
}
.saving-toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="screen active" id="screen-intro">
  <div class="container">
    <div class="intro-header">
      <div class="tag">MOCK · 전기</div>
      <h1>전기 모의고사 3차</h1>
      <p>이름과 학교, 전화번호 뒷자리를 입력하고 답안을 제출하세요</p>
    </div>
    <div class="form-card">
      <div class="form-group">
        <label>이름</label>
        <input type="text" id="input-name" placeholder="홍길동" autocomplete="off">
      </div>
      <div class="form-group">
        <label>학교</label>
        <input type="text" id="input-school" placeholder="○○고등학교" autocomplete="off">
      </div>
      <div class="form-group">
        <label>전화번호 뒷자리 4자리</label>
        <input type="tel" id="input-phone" maxlength="4" placeholder="1234" autocomplete="off">
      </div>
      <div class="form-info">
        <span>📋 총 <b id="totalCountDisplay"></b>문항 · 시험지를 보며 답안만 입력하세요</span>
      </div>
      <button class="btn" onclick="startQuiz()">답안 입력 시작 →</button>
    </div>
    <div style="text-align:center;margin-top:20px;">
      <a href="index.html" style="font-family:'DM Mono',monospace;font-size:0.8rem;color:var(--text-dim);text-decoration:none;">← 목록으로</a>
    </div>
  </div>
</div>

<div class="screen" id="screen-quiz">
  <div class="quiz-topbar">
    <div class="quiz-topbar-inner">
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="meta-row">
        <div class="meta-item">입력 <span id="metaProgress">0 / 0</span></div>
        <div class="meta-item">⏱ <span id="timerDisplay">00:00</span></div>
      </div>
    </div>
  </div>
  <div class="answer-body">
    <div class="answer-grid" id="answerGrid"></div>
  </div>
  <div class="submit-wrap">
    <button class="btn" onclick="submitQuiz()">채점하기 →</button>
  </div>
</div>

<div class="screen" id="screen-result">
  <div class="result-hero">
    <div class="result-tag">MOCK · 전기</div>
    <div class="result-name" id="resultName"></div>
    <div class="result-score" id="resultScore"></div>
    <div class="result-score-sub" id="resultScoreSub"></div>
    <div class="result-stats">
      <div class="stat-item">
        <div class="stat-val" id="statTime"></div>
        <div class="stat-label">풀이시간</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statCorrect"></div>
        <div class="stat-label">정답</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statWrong"></div>
        <div class="stat-label">오답</div>
      </div>
    </div>
  </div>
  <div class="score-table-wrap">
    <h2>문항별 채점 결과</h2>
    <div class="score-grid" id="scoreGrid"></div>
  </div>
  <div class="result-actions">
    <button class="btn btn-ghost" onclick="resetQuiz()">↺ 새로 응시하기</button>
  </div>
</div>

<div class="saving-toast" id="savingToast"></div>

<script>
const AT_TOKEN  = "patBcLElKAr7fPbgS.0f288a25e39501f27d9d33569371fc819acb54173cf44daa68fc028f16e479f9";
const AT_BASE   = "appmCOjqp5xIJuPqt";
const AT_SCORES = "scores";

const QUIZ_META = {
  subjectCode: "PHY",
  subjectName: "물리학",
  mainNo:      null,
  mainName:    "",
  subNo:       null,
  subName:     "",
  sectionNo:   null,
  sectionName: "전기 모의고사 3차"
};

// 정답 배열 (1~5)
const ANSWER_KEY = [3, 2, 3, 1, 4, 2, 3, 4, 2, 4, 3, 5, 1, 5, 2, 3, 3, 2, 4, 1, 4, 5];

let userName = '', userSchool = '', userPhone = '';
let userAnswers = {};
let timerInterval = null;
let elapsedSec = 0;
const TOTAL = ANSWER_KEY.length;
const LABELS = ['①','②','③','④','⑤'];

document.getElementById('totalCountDisplay').textContent = TOTAL || '—';

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}
function fmtTime(sec) {
  return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
}
function toast(msg, dur=2500) {
  const el = document.getElementById('savingToast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

function startQuiz() {
  if (TOTAL === 0) { alert('정답지가 아직 등록되지 않았습니다.'); return; }
  const name   = document.getElementById('input-name').value.trim();
  const school = document.getElementById('input-school').value.trim();
  const phone  = document.getElementById('input-phone').value.trim();
  if (!name)   { alert('이름을 입력해주세요.'); return; }
  if (!school) { alert('학교를 입력해주세요.'); return; }
  if (!/^[0-9]{4}$/.test(phone)) { alert('전화번호 뒷자리 4자리를 입력해주세요.'); return; }
  userName = name; userSchool = school; userPhone = phone;
  userAnswers = {}; elapsedSec = 0;
  renderAnswerGrid();
  showScreen('screen-quiz');
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    elapsedSec++;
    document.getElementById('timerDisplay').textContent = fmtTime(elapsedSec);
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

function renderAnswerGrid() {
  const grid = document.getElementById('answerGrid');
  grid.innerHTML = ANSWER_KEY.map((_, idx) => {
    const num = idx + 1;
    return `
      <div class="answer-row" id="row-${num}">
        <div class="q-label">Q${String(num).padStart(2,'0')}</div>
        <div class="choice-btns">
          ${[1,2,3,4,5].map(v => `
            <button class="choice-btn" id="cb-${num}-${v}" onclick="selectAnswer(${num}, ${v})">${LABELS[v-1]}</button>
          `).join('')}
        </div>
      </div>`;
  }).join('');
  updateProgress();
}

function selectAnswer(num, chosen) {
  userAnswers[num] = chosen;
  for (let v = 1; v <= 5; v++) {
    const btn = document.getElementById(`cb-${num}-${v}`);
    btn.classList.toggle('active', v === chosen);
  }
  document.getElementById(`row-${num}`).classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = Object.keys(userAnswers).length;
  document.getElementById('metaProgress').textContent = `${answered} / ${TOTAL}`;
  document.getElementById('progressFill').style.width = `${(answered / TOTAL) * 100}%`;
}

function submitQuiz() {
  const answered = Object.keys(userAnswers).length;
  if (answered < TOTAL) {
    if (!confirm(`아직 ${TOTAL - answered}문항을 입력하지 않았어요. 제출하시겠어요?`)) return;
  }
  stopTimer();
  showResult();
}

function showResult() {
  let correctCount = 0;
  const results = ANSWER_KEY.map((ans, idx) => {
    const num = idx + 1;
    const chosen = userAnswers[num] || null;
    const ok = chosen === ans;
    if (ok) correctCount++;
    return { num, ans, chosen, ok };
  });
  const wrongCount = TOTAL - correctCount;

  document.getElementById('resultName').textContent   = `${userName} · ${userSchool} · ${userPhone}`;
  document.getElementById('resultScore').textContent  = correctCount;
  document.getElementById('resultScoreSub').textContent = `/ ${TOTAL} 문항`;
  document.getElementById('statTime').textContent     = fmtTime(elapsedSec);
  document.getElementById('statCorrect').textContent  = `${correctCount}개`;
  document.getElementById('statWrong').textContent    = `${wrongCount}개`;

  const grid = document.getElementById('scoreGrid');
  grid.innerHTML = results.map(r => {
    const cls = r.chosen === null ? 'blank' : (r.ok ? 'ok' : 'fail');
    const displayAns = r.chosen ? LABELS[r.chosen - 1] : '–';
    return `
      <div class="score-cell ${cls}">
        <span class="cell-num">Q${String(r.num).padStart(2,'0')}</span>
        <span class="cell-ans">${displayAns}</span>
      </div>`;
  }).join('');

  showScreen('screen-result');
  saveScore(correctCount, TOTAL);
}

async function saveScore(score, total) {
  toast('점수 저장 중...');
  try {
    const fields = {
      '이름': userName, '학교': userSchool, 'phone_last4': userPhone,
      '날짜': new Date().toISOString().split('T')[0],
      '과목코드': QUIZ_META.subjectCode, '과목명': QUIZ_META.subjectName,
      '섹션명': QUIZ_META.sectionName, '총점': score, '총문항수': total,
      '풀이시간': fmtTime(elapsedSec)
    };
    const res = await fetch(`https://api.airtable.com/v0/${AT_BASE}/${AT_SCORES}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${AT_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields })
    });
    if (res.ok) toast('✓ 점수가 저장되었습니다.');
    else toast('저장 실패 — 네트워크를 확인해주세요.');
  } catch(e) { toast('저장 실패 — 네트워크를 확인해주세요.'); }
}

function resetQuiz() {
  userName = ''; userSchool = ''; userPhone = '';
  userAnswers = {}; elapsedSec = 0;
  document.getElementById('input-name').value = '';
  document.getElementById('input-school').value = '';
  document.getElementById('input-phone').value = '';
  document.getElementById('timerDisplay').textContent = '00:00';
  showScreen('screen-intro');
}
</script>
</body>
</html>
